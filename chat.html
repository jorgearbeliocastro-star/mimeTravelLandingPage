<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mime Travel — Chat con un agente</title>
<style>
  :root {
    --primary: #1B3A5C;
    --coral: #FF7A59;
    --light: #FAFAFA;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--light);
    color: #1A1A1A;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--primary);
    color: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header a { color: #fff; text-decoration: none; font-size: 20px; }
  header strong { font-size: 15px; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
  }
  .bubble.client {
    align-self: flex-end;
    background: var(--coral);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.agent {
    align-self: flex-start;
    background: #fff;
    border: 1px solid rgba(0,0,0,0.08);
    border-bottom-left-radius: 4px;
  }
  .empty {
    text-align: center;
    color: rgba(26,26,26,0.5);
    font-size: 13px;
    margin-top: 20px;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    border-top: 1px solid rgba(0,0,0,0.08);
    background: #fff;
  }
  input {
    flex: 1;
    padding: 11px 14px;
    border-radius: 20px;
    border: 1.5px solid rgba(0,0,0,0.15);
    font-size: 15px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--primary); }
  button {
    border: none;
    background: var(--coral);
    color: #fff;
    border-radius: 20px;
    padding: 0 20px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
</style>
</head>
<body>
  <header>
    <a href="index.html">←</a>
    <strong>Chat con un agente</strong>
  </header>
  <div class="messages" id="messages">
    <div class="empty" id="emptyMsg">Escribinos lo que necesites — un agente te va a responder acá mismo.</div>
  </div>
  <form id="chatForm">
    <input type="text" id="chatInput" placeholder="Escribí tu mensaje…" autocomplete="off" required>
    <button type="submit" id="sendBtn">Enviar</button>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://ihrfaprvzdafclquuhlh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lcWymV25nHd2_iOMjRwD4A_XOXvOdPK';
    const WEBHOOK_SECRET = '9aa883ff6caef8d5b41e2c749cccaf121860629737147d12';
    const FUNCTIONS_URL = SUPABASE_URL + '/functions/v1/send-request-notification';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Mismo token que el resto de la web pública (ver getOrCreateWebClientToken
    // en index.html) — un solo hilo de chat por dispositivo, se reusa siempre.
    function getClientToken() {
      const KEY = 'la-expancion.client-token';
      let token = localStorage.getItem(KEY);
      if (!token) {
        token = crypto.randomUUID();
        localStorage.setItem(KEY, token);
      }
      return token;
    }

    const messagesEl = document.getElementById('messages');
    const emptyMsg = document.getElementById('emptyMsg');
    let lastRenderedIds = '';

    function renderMessages(msgs) {
      const idsKey = msgs.map((m) => m.id).join(',');
      if (idsKey === lastRenderedIds) return; // evita parpadeo si no cambió nada
      lastRenderedIds = idsKey;
      const wasAtBottom = messagesEl.scrollTop + messagesEl.clientHeight >= messagesEl.scrollHeight - 40;
      messagesEl.innerHTML = '';
      if (!msgs.length) {
        messagesEl.appendChild(emptyMsg);
      } else {
        msgs.forEach((m) => {
          const b = document.createElement('div');
          b.className = 'bubble ' + (m.sender === 'client' ? 'client' : 'agent');
          b.textContent = m.body;
          messagesEl.appendChild(b);
        });
      }
      if (wasAtBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function poll() {
      try {
        const clientToken = getClientToken();
        const { data, error } = await supabaseClient.rpc('get_chat_messages', { p_token: clientToken });
        if (!error && data) renderMessages(data);
      } catch (e) {
        // no bloqueante — se reintenta en el próximo tick
      }
    }
    poll();
    setInterval(poll, 3000);

    document.getElementById('chatForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const btn = document.getElementById('sendBtn');
      const body = input.value.trim();
      if (!body) return;
      btn.disabled = true;
      try {
        const clientToken = getClientToken();
        const { error } = await supabaseClient.rpc('send_client_chat_message', { p_token: clientToken, p_body: body });
        if (error) throw error;
        input.value = '';
        // Mismo aviso que ya recibe el equipo por un mensaje de chat nuevo
        // (hoy pausado mientras se prueba la web — ver PUSH_NOTIFICATIONS_DISABLED).
        fetch(FUNCTIONS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Webhook-Secret': WEBHOOK_SECRET },
          body: JSON.stringify({ type: 'INSERT', table: 'pool_chat_message', record: { clientToken } }),
        }).catch(() => {});
        lastRenderedIds = ''; // fuerza a re-renderizar con el mensaje nuevo
        poll();
      } catch (err) {
        alert('No se pudo enviar: ' + (err && err.message ? err.message : String(err)));
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
