<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mime Travel — Cotizaciones</title>
<style>
  :root {
    --primary: #1B3A5C;
    --coral: #FF7A59;
    --light: #FAFAFA;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--light);
    color: #1A1A1A;
  }
  header {
    background: var(--primary);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header a { color: #fff; text-decoration: none; font-size: 13px; opacity: 0.85; }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 8px;
    border-radius: 8px;
    background: #fff;
    border: 1px solid rgba(0,0,0,0.1);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    color: rgba(26,26,26,0.6);
  }
  .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .empty { text-align: center; color: rgba(26,26,26,0.5); font-size: 14px; margin-top: 40px; }
  .quote-card {
    background: #fff;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .quote-card .route { font-weight: 700; font-size: 15px; }
  .quote-card .meta { font-size: 12px; color: rgba(26,26,26,0.55); margin-top: 2px; }
  .quote-card .notes { font-size: 13px; margin-top: 8px; white-space: pre-wrap; }
  .quote-card .badge {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 8px;
    background: #eee;
    margin-top: 6px;
  }
  .badge.mine { background: #d4edda; color: #1e7e34; }
  .badge.quoted { background: #fff3cd; color: #856404; }
  .badge.decided-accepted { background: #d4edda; color: #1e7e34; }
  .badge.decided-declined { background: #f8d7da; color: #c0392b; }
  .price-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .price-row input {
    flex: 1;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1.5px solid rgba(0,0,0,0.15);
    font-size: 14px;
    font-family: inherit;
  }
  .price-row button {
    border: none;
    background: var(--coral);
    color: #fff;
    border-radius: 8px;
    padding: 0 16px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .price-row button:disabled { opacity: 0.5; }
  .claim-btn {
    margin-top: 10px;
    border: 1.5px solid var(--primary);
    background: #fff;
    color: var(--primary);
    border-radius: 8px;
    padding: 8px 14px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .already-quoted { font-size: 13px; margin-top: 8px; color: rgba(26,26,26,0.7); }
  .chat-toggle-btn {
    margin-top: 8px;
    margin-left: 8px;
    border: 1.5px solid rgba(0,0,0,0.15);
    background: #fff;
    color: rgba(26,26,26,0.7);
    border-radius: 8px;
    padding: 8px 14px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .chat-thread {
    margin-top: 10px;
    border-top: 1px solid rgba(0,0,0,0.08);
    padding-top: 10px;
  }
  .chat-messages {
    max-height: 240px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 8px;
  }
  .chat-bubble {
    max-width: 82%;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.4;
  }
  .chat-bubble.client { align-self: flex-start; background: #eee; }
  .chat-bubble.agent { align-self: flex-end; background: var(--primary); color: #fff; }
  .chat-form { display: flex; gap: 6px; }
  .chat-form input {
    flex: 1;
    padding: 8px 12px;
    border-radius: 16px;
    border: 1.5px solid rgba(0,0,0,0.15);
    font-size: 13px;
    font-family: inherit;
  }
  .chat-form button {
    border: none;
    background: var(--coral);
    color: #fff;
    border-radius: 16px;
    padding: 0 14px;
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <header>
    <strong>Cotizaciones</strong>
    <a href="panel.html">← Panel</a>
  </header>
  <main>
    <div class="tabs">
      <div class="tab active" data-tab="new">Nuevas</div>
      <div class="tab" data-tab="mine">Mis cotizadas</div>
    </div>
    <div id="list"></div>
    <div class="empty" id="emptyMsg">No hay nada acá.</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="presence.js"></script>
  <script>
    const SUPABASE_URL = 'https://ihrfaprvzdafclquuhlh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lcWymV25nHd2_iOMjRwD4A_XOXvOdPK';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let agentId = null;
    let currentTab = 'new';
    let pollTimer = null;

    (async () => {
      const { data: aalData } = await supabaseClient.auth.mfa.getAuthenticatorAssuranceLevel();
      if (!aalData || aalData.currentLevel !== 'aal2') {
        window.location.href = 'login.html';
        return;
      }
      const { data: userData } = await supabaseClient.auth.getUser();
      if (!userData?.user) {
        window.location.href = 'login.html';
        return;
      }
      agentId = userData.user.id;
      startPresenceHeartbeat(supabaseClient);
      // El Dueño (super_admin) además puede ver TODAS las cotizaciones del
      // equipo, no solo las propias — mismo criterio que ya tiene la app
      // ("Todas las cotizaciones" vs "Cotizaciones nuevas"). Un Agente
      // normal no ve esa pestaña.
      const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', agentId).single();
      if (profile?.role === 'super_admin') {
        const allTab = document.createElement('div');
        allTab.className = 'tab';
        allTab.dataset.tab = 'all';
        allTab.textContent = 'Todas (equipo)';
        allTab.addEventListener('click', () => selectTab(allTab));
        document.querySelector('.tabs').appendChild(allTab);
      }
      loadQuotes();
      pollTimer = setInterval(loadQuotes, 6000);
    })();

    function selectTab(tabEl) {
      document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
      tabEl.classList.add('active');
      currentTab = tabEl.dataset.tab;
      loadQuotes();
    }
    document.querySelectorAll('.tab').forEach((tabEl) => {
      tabEl.addEventListener('click', () => selectTab(tabEl));
    });

    async function loadQuotes() {
      let query = supabaseClient.from('quote_requests').select('*').order('created_at', { ascending: false }).limit(30);
      if (currentTab === 'new') {
        // Nuevas sin tomar todavía — mismo criterio que "Cotizaciones
        // nuevas" en la app: solo pending, sin agente asignado.
        query = query.eq('status', 'pending');
      } else if (currentTab === 'all') {
        // Solo Dueño — todo el equipo, cotizadas/decididas (no pendientes
        // sueltas, esas ya se ven en "Nuevas"; no compradas/expiradas,
        // para no acumular ruido viejo).
        query = query.in('status', ['quoted', 'decided']);
      } else {
        // Ya cotizadas por MÍ (tomadas), esperando o ya con decisión del
        // cliente — no incluye compradas/expiradas para no acumular ruido
        // viejo en esta lista básica.
        query = query.eq('claimed_by_agent_id', agentId).in('status', ['quoted', 'decided']);
      }
      const { data, error } = await query;
      if (error) return;
      renderList(data || []);
    }

    function fmtRoute(q) {
      if (q.origin) return q.origin + ' → ' + q.destination;
      return q.destination;
    }

    function renderList(quotes) {
      const list = document.getElementById('list');
      const emptyMsg = document.getElementById('emptyMsg');
      list.innerHTML = '';
      if (!quotes.length) {
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';
      quotes.forEach((q) => {
        const card = document.createElement('div');
        card.className = 'quote-card';
        let badgeHtml = '';
        if (q.status === 'quoted') badgeHtml = '<span class="badge quoted">Esperando al cliente</span>';
        else if (q.status === 'decided') {
          badgeHtml = q.client_decision === 'accepted'
            ? '<span class="badge decided-accepted">Aceptó — falta cobrar</span>'
            : '<span class="badge decided-declined">Rechazó</span>';
        }
        // "Cuántos viajan" (lo que dijo el cliente AL PEDIR, antes de
        // cotizar) — solo se pidió para cruceros hasta ahora, ver
        // 0084_quote_requested_party.sql. Si ya aceptó, mejor mostrar los
        // pasajeros completos que cargó (nombre real, no solo la cantidad).
        let partyHtml = '';
        if (q.requested_adults != null) {
          partyHtml = (q.requested_adults) + ' adulto' + (q.requested_adults === 1 ? '' : 's') +
            (q.requested_children ? ', ' + q.requested_children + ' niño(s)' : '');
        }
        let passengersHtml = '';
        if (Array.isArray(q.passengers) && q.passengers.length) {
          passengersHtml = '<div class="notes"><strong>Pasajeros:</strong> ' +
            q.passengers.map((p) => (p.fullName || (p.firstName + ' ' + p.lastName) || 'Sin nombre').toString().replace(/</g, '&lt;')).join(', ') +
            '</div>';
        }
        card.innerHTML =
          '<div class="route">' + fmtRoute(q) + '</div>' +
          '<div class="meta">' + (q.category || '') + ' · ' + (q.contact_name || 'Sin nombre') + (q.contact_phone ? ' · ' + q.contact_phone : '') + (q.contact_email ? ' · ' + q.contact_email : '') + '</div>' +
          (partyHtml ? '<div class="meta">' + partyHtml + '</div>' : '') +
          (q.notes ? '<div class="notes">' + q.notes.replace(/</g, '&lt;') + '</div>' : '') +
          passengersHtml +
          badgeHtml;
        list.appendChild(card);

        if (currentTab === 'new') {
          const claimBtn = document.createElement('button');
          claimBtn.className = 'claim-btn';
          claimBtn.textContent = 'Tomar y poner precio';
          claimBtn.addEventListener('click', () => showPriceForm(card, q));
          card.appendChild(claimBtn);
        } else if (q.status === 'quoted') {
          const info = document.createElement('div');
          info.className = 'already-quoted';
          info.textContent = 'Precio enviado: USD ' + (q.quoted_price_basic_usd ?? q.quoted_price_usd);
          card.appendChild(info);
        } else if (q.status === 'decided' && q.client_decision === 'accepted') {
          const info = document.createElement('div');
          info.className = 'already-quoted';
          const hasConsent = !!(q.payment_consent_at && q.payment_consent_ip);
          info.textContent = 'Precio aceptado: USD ' + (q.quoted_price_basic_usd ?? q.quoted_price_usd) +
            (hasConsent ? ' — consentimiento de cobro confirmado' : ' — SIN consentimiento de cobro todavía');
          card.appendChild(info);

          // Regla que quedó definida: sin el consentimiento (fecha + IP)
          // guardado, no se puede cerrar la venta — sin eso no hay
          // respaldo si el cliente después dice que no reconoce el cargo.
          const sellBtn = document.createElement('button');
          sellBtn.className = 'claim-btn';
          sellBtn.textContent = hasConsent ? '✅ Marcar como vendido' : '🔒 Falta consentimiento de cobro';
          sellBtn.disabled = !hasConsent;
          if (!hasConsent) sellBtn.style.opacity = '0.5';
          sellBtn.addEventListener('click', () => showSellForm(card, q));
          card.appendChild(sellBtn);
        }

        // Chat con el cliente — mismo mecanismo que ya usa la app
        // (quote_request_messages), disponible para CUALQUIER cotización,
        // no solo las de "Consulta general". Antes esto solo se podía
        // contestar desde la app; algunos clientes prefieren escribir en
        // vez de llamar.
        const chatBtn = document.createElement('button');
        chatBtn.className = 'chat-toggle-btn';
        chatBtn.textContent = '💬 Chat';
        chatBtn.addEventListener('click', () => toggleChat(card, q));
        card.appendChild(chatBtn);
      });
    }

    async function toggleChat(card, quote) {
      const existing = card.querySelector('.chat-thread');
      if (existing) {
        existing.remove();
        return;
      }
      const thread = document.createElement('div');
      thread.className = 'chat-thread';
      thread.innerHTML =
        '<div class="chat-messages"><span style="font-size:12px;color:rgba(26,26,26,0.5);">Cargando…</span></div>' +
        '<form class="chat-form">' +
        '<input type="text" placeholder="Escribí tu respuesta…" autocomplete="off" required>' +
        '<button type="submit">Enviar</button>' +
        '</form>';
      card.appendChild(thread);
      await loadChatMessages(thread, quote.id);

      thread.querySelector('.chat-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = thread.querySelector('input');
        const body = input.value.trim();
        if (!body) return;
        input.value = '';
        const { error } = await supabaseClient
          .from('quote_request_messages')
          .insert({ quote_request_id: quote.id, sender: 'agent', sender_agent_id: agentId, body });
        if (error) {
          alert('No se pudo enviar: ' + error.message);
          return;
        }
        // Mismo aviso que ya recibe el cliente cuando el agente le escribe
        // (hoy pausado mientras se prueba la web — ver PUSH_NOTIFICATIONS_DISABLED).
        fetch('https://ihrfaprvzdafclquuhlh.supabase.co/functions/v1/send-request-notification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Webhook-Secret': '9aa883ff6caef8d5b41e2c749cccaf121860629737147d12' },
          body: JSON.stringify({ type: 'INSERT', table: 'agent_message', record: { quoteRequestId: quote.id } }),
        }).catch(() => {});
        await loadChatMessages(thread, quote.id);
      });
    }

    async function loadChatMessages(thread, quoteId) {
      const { data, error } = await supabaseClient
        .from('quote_request_messages')
        .select('*')
        .eq('quote_request_id', quoteId)
        .order('created_at', { ascending: true });
      const messagesEl = thread.querySelector('.chat-messages');
      if (error) {
        messagesEl.innerHTML = '<span style="font-size:12px;color:#c0392b;">No se pudo cargar el chat.</span>';
        return;
      }
      messagesEl.innerHTML = '';
      if (!data.length) {
        messagesEl.innerHTML = '<span style="font-size:12px;color:rgba(26,26,26,0.5);">Sin mensajes todavía.</span>';
      }
      data.forEach((m) => {
        const b = document.createElement('div');
        b.className = 'chat-bubble ' + (m.sender === 'client' ? 'client' : 'agent');
        b.textContent = m.body;
        messagesEl.appendChild(b);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Precio básico y simple nada más (un solo número) — a propósito no
    // incluye todavía extras/camarotes/asientos como sí tiene la app; eso
    // se suma después con más calma, esto es la base mínima para no dejar
    // al agente sin ninguna forma de cotizar desde la web.
    function showPriceForm(card, quote) {
      if (card.querySelector('.price-row')) return; // ya está abierto
      const row = document.createElement('div');
      row.className = 'price-row';
      row.innerHTML =
        '<input type="number" inputmode="decimal" placeholder="Precio en USD" min="1" step="0.01">' +
        '<button type="button">Enviar</button>';
      card.appendChild(row);
      const input = row.querySelector('input');
      const btn = row.querySelector('button');
      input.focus();
      btn.addEventListener('click', async () => {
        const price = Number(input.value);
        if (!price || price <= 0) {
          alert('Poné un precio válido.');
          return;
        }
        btn.disabled = true;
        // Vence en 1 hora, mismo criterio que ya usa el resto del sistema
        // (ver quoteCountdownInterval en index.html).
        const priceExpiresAt = new Date(Date.now() + 60 * 60 * 1000).toISOString();
        const { error } = await supabaseClient
          .from('quote_requests')
          .update({
            status: 'quoted',
            claimed_by_agent_id: agentId,
            quoted_price_usd: price,
            quoted_price_basic_usd: price,
            price_expires_at: priceExpiresAt,
            updated_at: new Date().toISOString(),
          })
          .eq('id', quote.id)
          .eq('status', 'pending'); // por si otro agente ya la tomó justo antes
        if (error) {
          alert('No se pudo enviar: ' + error.message);
          btn.disabled = false;
          return;
        }
        loadQuotes();
      });
    }

    // Cierre de venta — pide el número de confirmación/referencia que da
    // la agencia (Classic Vacations, Downtown Travel, etc.) al cerrar la
    // compra ahí. Ya se validó antes que exista el consentimiento de cobro
    // (ver hasConsent más arriba) — acá solo falta la referencia.
    function showSellForm(card, quote) {
      if (card.querySelector('.price-row')) return;
      const row = document.createElement('div');
      row.className = 'price-row';
      row.innerHTML =
        '<input type="text" placeholder="N.º de confirmación de la agencia">' +
        '<button type="button">Confirmar venta</button>';
      card.appendChild(row);
      const input = row.querySelector('input');
      const btn = row.querySelector('button');
      input.focus();
      btn.addEventListener('click', async () => {
        const reference = input.value.trim();
        if (!reference) {
          alert('Poné el número de confirmación que te dio la agencia.');
          return;
        }
        if (!confirm('¿Confirmás que la venta ya está cerrada con la agencia, con la referencia "' + reference + '"?')) return;
        btn.disabled = true;
        const { error } = await supabaseClient
          .from('quote_requests')
          .update({
            status: 'purchased',
            reference_code: reference,
            purchased_at: new Date().toISOString(),
            updated_at: new Date().toISOString(),
          })
          .eq('id', quote.id)
          .eq('status', 'decided'); // por las dudas de que algo haya cambiado justo antes
        if (error) {
          alert('No se pudo confirmar: ' + error.message);
          btn.disabled = false;
          return;
        }
        loadQuotes();
      });
    }
  </script>
</body>
</html>
