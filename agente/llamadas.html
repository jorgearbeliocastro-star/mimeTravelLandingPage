<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mime Travel — Llamadas</title>
<style>
  :root {
    --primary: #1B3A5C;
    --coral: #FF7A59;
    --light: #FAFAFA;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--light);
    color: #1A1A1A;
  }
  header {
    background: var(--primary);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header a { color: #fff; text-decoration: none; font-size: 13px; opacity: 0.85; }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px;
  }
  .empty {
    text-align: center;
    color: rgba(26,26,26,0.5);
    font-size: 14px;
    margin-top: 40px;
  }
  .call-card {
    background: #fff;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    /* Antes iba todo en una sola fila (info + 2 botones) — en pantallas
       angostas de celular no entraba y los botones terminaban superpuestos
       encima del texto. Apilado en columna, cada cosa en su propia línea,
       no se puede superponer sea cual sea el ancho de pantalla. */
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .call-card .info { font-size: 14px; font-weight: 700; }
  .call-card .sub { font-size: 12px; color: rgba(26,26,26,0.5); }
  .call-actions { display: flex; gap: 8px; }
  .call-actions .btn { flex: 1; }
  .btn { border: none; border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-accept { background: #1e7e34; color: #fff; }
  .btn-decline { background: #c0392b; color: #fff; }

  /* Pantalla de llamada en curso */
  .call-screen {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    /* inset:0 (alto por "bottom:0") en el celular se estira detrás de la
       barra del navegador y empuja los controles de abajo fuera de lo que
       se ve — con alto explícito en dvh (el "viewport dinámico" real) se
       ajusta solo al espacio visible. */
    height: 100vh;
    height: 100dvh;
    background: #0d1b2a;
    color: #fff;
    display: none;
    flex-direction: column;
    z-index: 50;
  }
  .call-screen.active { display: flex; }
  .status-bar { text-align: center; padding: 18px; font-weight: 700; }
  .client-info-box {
    margin: 0 16px 12px;
    padding: 10px 14px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.5;
  }
  /* min-height:0 es necesario porque por defecto un hijo flex no se achica
     más chico que el tamaño de SU contenido (acá, los <video>) — sin esto,
     el área de video empujaba los botones de abajo fuera de la pantalla
     en vez de compartir el espacio con ellos. */
  .video-area { flex: 1; min-height: 0; position: relative; background: #000; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #111; }
  #localVideo { position: absolute; bottom: 16px; right: 16px; width: 110px; height: 150px; object-fit: cover; border-radius: 10px; border: 2px solid rgba(255,255,255,0.4); background: #222; }
  .controls { display: flex; justify-content: center; gap: 20px; padding: 24px; padding-bottom: max(24px, env(safe-area-inset-bottom)); }
  .btn-circle { width: 58px; height: 58px; border-radius: 50%; border: none; background: rgba(255,255,255,0.15); color: #fff; font-size: 20px; cursor: pointer; }
  .btn-circle.active { background: var(--coral); }
  .btn-hangup { background: #c0392b; }

  .photo-overlay {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(0,0,0,0.92);
    display: none;
    flex-direction: column;
  }
  .photo-overlay.active { display: flex; }
  .photo-overlay-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    color: #fff;
    font-size: 12px;
  }
  .photo-overlay-header button {
    background: none;
    border: none;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
  }
  .request-photo-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 0 16px 8px;
  }
  .btn-request {
    border: 1.5px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.1);
    color: #fff;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-request:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .photo-img-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .photo-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .photo-watermark {
    position: absolute;
    color: rgba(255,255,255,0.55);
    text-shadow: 0 0 4px rgba(0,0,0,0.8);
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    pointer-events: none;
    transform: rotate(-25deg);
  }
  .wm-1 { top: 15%; left: 8%; }
  .wm-2 { top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-25deg); }
  .wm-3 { bottom: 15%; right: 8%; }
  /* Si la pestaña pierde el foco (ej. alguien abre la herramienta de
     captura de Windows/Mac), la foto se tapa sola — no impide una
     captura hecha con OTRO celular apuntando a la pantalla, pero sí
     frena el caso más común. */
  .photo-overlay.blurred .photo-img-wrap img {
    filter: blur(30px);
  }
</style>
</head>
<body>
  <header>
    <strong>Llamadas</strong>
    <a href="panel.html">← Panel</a>
  </header>
  <main>
    <div id="list"></div>
    <div class="empty" id="emptyMsg">No hay llamadas esperando.</div>
  </main>

  <div class="call-screen" id="callScreen">
    <div class="status-bar" id="statusBar">Conectando…</div>
    <div id="clientInfoBox" class="client-info-box"></div>
    <div class="video-area">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="request-photo-row">
      <button class="btn-request" id="requestPassportBtn">🛂 Pedir pasaporte</button>
      <button class="btn-request" id="requestCardBtn">💳 Pedir tarjeta</button>
      <button class="btn-request" id="requestEmailBtn">✉️ Pedir correo</button>
      <button class="btn-request" id="shareScreenBtn">🖥️ Compartir pantalla</button>
      <button class="btn-request" id="pipBtn">🗗 Ventana flotante (para buscar la reserva)</button>
    </div>
    <div class="controls">
      <button class="btn-circle" id="muteBtn">🎤</button>
      <button class="btn-circle" id="videoBtn">📷</button>
      <button class="btn-circle btn-hangup" id="hangupBtn">⏹</button>
    </div>
  </div>

  <!-- Foto (pasaporte o tarjeta) que mande el cliente durante la llamada —
       llega directo por el canal de datos de WebRTC, nunca pasa por
       Supabase. Se cierra sola al colgar (ver closeCallScreen) — no queda
       guardada en ningún lado, ni siquiera acá, solo vive en memoria
       mientras dura la pestaña abierta. -->
  <div class="photo-overlay" id="photoOverlay">
    <div class="photo-overlay-header">
      <span id="photoOverlayLabel">No se guarda, solo se muestra acá</span>
      <button id="photoCloseBtn">✕</button>
    </div>
    <div class="photo-img-wrap">
      <img id="photoImg" alt="Foto del cliente">
      <!-- Marca de agua con el nombre del agente + hora en vivo — no
           impide una captura (nada lo hace, ver conversación), pero si se
           filtra queda trazado de quién la vio y cuándo. Varias copias
           para que no alcance con recortar una esquina. -->
      <div class="photo-watermark wm-1" id="wm1"></div>
      <div class="photo-watermark wm-2" id="wm2"></div>
      <div class="photo-watermark wm-3" id="wm3"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../webrtcCall.js"></script>
  <script src="presence.js"></script>
  <script>
    const SUPABASE_URL = 'https://ihrfaprvzdafclquuhlh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lcWymV25nHd2_iOMjRwD4A_XOXvOdPK';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let agentId = null;
    let agentName = '';
    let call = null;
    let pollTimer = null;

    (async () => {
      const { data: aalData } = await supabaseClient.auth.mfa.getAuthenticatorAssuranceLevel();
      if (!aalData || aalData.currentLevel !== 'aal2') {
        window.location.href = 'login.html';
        return;
      }
      const { data: userData } = await supabaseClient.auth.getUser();
      if (!userData?.user) {
        window.location.href = 'login.html';
        return;
      }
      agentId = userData.user.id;
      const { data: profile } = await supabaseClient.from('profiles').select('full_name').eq('id', agentId).single();
      agentName = profile?.full_name || userData.user.email || '';
      startPresenceHeartbeat(supabaseClient);
      loadRingingCalls();
      pollTimer = setInterval(loadRingingCalls, 3000);
    })();

    // Marca de agua en vivo (nombre + hora, se actualiza cada segundo)
    // sobre la foto del pasaporte/tarjeta — solo corre mientras el
    // overlay está visible.
    setInterval(() => {
      if (!document.getElementById('photoOverlay').classList.contains('active')) return;
      const text = agentName + ' · ' + new Date().toLocaleString('es');
      document.getElementById('wm1').textContent = text;
      document.getElementById('wm2').textContent = text;
      document.getElementById('wm3').textContent = text;
    }, 1000);

    // Si la pestaña pierde el foco mientras se está mostrando la foto (ej.
    // el agente abre la herramienta de captura de pantalla), se difumina
    // sola — no frena una foto sacada con OTRO celular, pero sí el caso
    // más común de captura accidental o casual.
    document.addEventListener('visibilitychange', () => {
      document.getElementById('photoOverlay').classList.toggle('blurred', document.visibilityState !== 'visible');
    });
    window.addEventListener('blur', () => {
      if (document.getElementById('photoOverlay').classList.contains('active')) {
        document.getElementById('photoOverlay').classList.add('blurred');
      }
    });
    window.addEventListener('focus', () => {
      document.getElementById('photoOverlay').classList.remove('blurred');
    });

    // Tono de llamada propio, sintetizado (nada de archivo de audio
    // externo) — sonido de "monedas cayendo": varios clics metálicos
    // cortos con tono al azar, como una alcancía. Suena mientras esta
    // pestaña esté abierta y haya al menos una llamada sin atender; la
    // notificación push del sistema (con el sonido genérico de Windows)
    // cubre el caso de la pestaña cerrada/en otra ventana.
    // Grabación real (no sintetizada) de caja registradora — dominio
    // público, Wikimedia Commons (https://commons.wikimedia.org/wiki/File:Cash_register.ogg).
    // Va embebida en base64 en el <audio id="ringtoneAudio"> de más abajo,
    // así no depende de ningún servidor externo ni de CORS.
    let ringing = false;
    let ringTimer = null;
    function playRingBurst() {
      const audio = document.getElementById('ringtoneAudio');
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }
    function startRingtone() {
      if (ringing) return;
      ringing = true;
      playRingBurst();
      // Cada 2 segundos — pedido explícito: que suene más seguido, para
      // no perderse una llamada por tenerlo bajo (el archivo dura ~2.2s).
      ringTimer = setInterval(playRingBurst, 2000);
    }
    function stopRingtone() {
      ringing = false;
      if (ringTimer) {
        clearInterval(ringTimer);
        ringTimer = null;
      }
      const audio = document.getElementById('ringtoneAudio');
      audio.pause();
      audio.currentTime = 0;
    }

    // Estos datos los llena CUALQUIER visitante anónimo desde la web
    // pública (nombre, teléfono, correo, idioma del navegador) — sin
    // escapar, alguien podría meter HTML/JS ahí y que se ejecute acá, con
    // la sesión autenticada del agente. Se usa en cada lugar donde un
    // campo de cliente entra a innerHTML.
    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadRingingCalls() {
      const { data, error } = await supabaseClient.rpc('get_ringing_calls_for_agent', { p_agent_id: agentId });
      if (error) return;
      const calls = data || [];
      if (calls.length) startRingtone();
      else stopRingtone();
      renderList(calls);
    }

    function renderList(calls) {
      const list = document.getElementById('list');
      const emptyMsg = document.getElementById('emptyMsg');
      list.innerHTML = '';
      if (!calls.length) {
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';
      calls.forEach((c) => {
        const card = document.createElement('div');
        card.className = 'call-card';
        card.innerHTML =
          '<div><div class="info">Llamada entrante</div><div class="sub">Idioma: ' + escapeHtml(c.client_language || '—') + '</div></div>' +
          '<div class="call-actions"><button class="btn btn-accept">Atender</button><button class="btn btn-decline">Rechazar</button></div>';
        card.querySelector('.btn-accept').addEventListener('click', () => acceptCall(c.id, c.client_token));
        card.querySelector('.btn-decline').addEventListener('click', () => declineCall(c.id));
        list.appendChild(card);
      });
    }

    async function acceptCall(callId, clientToken) {
      stopRingtone();
      clearInterval(pollTimer);
      const { error } = await supabaseClient
        .from('call_requests')
        .update({ status: 'accepted', accepted_by: agentId, updated_at: new Date().toISOString() })
        .eq('id', callId);
      if (error) {
        alert('No se pudo atender la llamada — probá de nuevo.');
        pollTimer = setInterval(loadRingingCalls, 3000);
        return;
      }
      openCallScreen(callId, clientToken);
    }

    // Quién es y qué tiene reservado/cotizado — mismo dato que ya ve el
    // agente en la app, solo que acá se busca por client_token (así el
    // que atienda, sea o no el agente de siempre, sabe con quién habla en
    // vez de entrar a ciegas). Solo la más reciente, no hace falta el
    // historial completo en la llamada.
    async function loadClientInfo(clientToken) {
      const infoBox = document.getElementById('clientInfoBox');
      infoBox.textContent = 'Buscando datos del cliente…';
      const { data, error } = await supabaseClient
        .from('quote_requests')
        .select('contact_name, contact_email, contact_phone, category, origin, destination, status')
        .eq('client_token', clientToken)
        .order('created_at', { ascending: false })
        .limit(1)
        .maybeSingle();
      if (error || !data) {
        infoBox.textContent = 'Sin cotizaciones anteriores de este cliente.';
        return;
      }
      const route = data.origin ? escapeHtml(data.origin) + ' → ' + escapeHtml(data.destination) : escapeHtml(data.destination);
      infoBox.innerHTML =
        '<strong>' + escapeHtml(data.contact_name || 'Sin nombre') + '</strong><br>' +
        (data.contact_email ? escapeHtml(data.contact_email) + '<br>' : '') +
        (data.contact_phone ? escapeHtml(data.contact_phone) + '<br>' : '') +
        route + ' · ' + escapeHtml(data.status);
    }

    // El correo llega directo por el canal de datos (nunca pasa por
    // Supabase de lado del cliente) — acá, del lado del agente, recién se
    // guarda, y solo en esta tabla puntual (no en quote_requests, para no
    // tocar/mezclar filas de cotizaciones reales). client_token como clave
    // es lo que permite, a futuro, encontrar el correo de un cliente que
    // llamó sin haber pasado nunca por un formulario de cotización.
    async function saveClientEmail(callId, clientToken, email, source) {
      const infoBox = document.getElementById('clientInfoBox');
      const { error } = await supabaseClient.from('client_contacts').upsert({
        client_token: clientToken,
        email,
        email_source: source,
        captured_by_agent_id: agentId,
        call_request_id: callId,
        updated_at: new Date().toISOString(),
      });
      if (error) {
        infoBox.innerHTML += '<br><strong style="color:#ffb4b4;">No se pudo guardar el correo: ' + escapeHtml(error.message) + '</strong>';
        return;
      }
      // `email` viaja por el canal de datos de WebRTC directo desde el
      // cliente (a mano o desde el token de Google) — igual de no confiable
      // que cualquier otro campo que llena el cliente, se escapa igual.
      infoBox.innerHTML += '<br>✉️ Correo guardado: <strong>' + escapeHtml(email) + '</strong> (' + (source === 'google' ? 'Google' : 'a mano') + ')';
    }

    async function declineCall(callId) {
      stopRingtone();
      await supabaseClient.from('call_requests').update({ status: 'declined', updated_at: new Date().toISOString() }).eq('id', callId);
      loadRingingCalls();
    }

    const PHOTO_KIND_LABELS = {
      passport: 'Pasaporte del cliente',
      card: 'Tarjeta de pago del cliente — no anotar el número, solo confirmar los últimos 4 dígitos',
      document: 'Documento del cliente',
    };
    let currentPhotoUrl = null;
    function showPassportPhoto(blob, kind) {
      if (currentPhotoUrl) URL.revokeObjectURL(currentPhotoUrl); // la anterior no queda ni en memoria
      currentPhotoUrl = URL.createObjectURL(blob);
      document.getElementById('photoImg').src = currentPhotoUrl;
      document.getElementById('photoOverlayLabel').textContent =
        (PHOTO_KIND_LABELS[kind] || PHOTO_KIND_LABELS.document) + ' — no se guarda, solo se muestra acá';
      document.getElementById('photoOverlay').classList.add('active');
    }
    function hidePassportPhoto() {
      document.getElementById('photoOverlay').classList.remove('active');
      if (currentPhotoUrl) {
        URL.revokeObjectURL(currentPhotoUrl);
        currentPhotoUrl = null;
      }
      document.getElementById('photoImg').src = '';
    }
    document.getElementById('photoCloseBtn').addEventListener('click', hidePassportPhoto);

    function openCallScreen(callId, clientToken) {
      document.getElementById('callScreen').classList.add('active');
      const statusBar = document.getElementById('statusBar');
      document.getElementById('clientInfoBox').textContent = '';
      if (clientToken) loadClientInfo(clientToken);
      // Los botones de "Pedir foto" arrancan bloqueados — si se piden antes
      // de que la llamada esté conectada de verdad, ese aviso puntual se
      // pierde sin reintento (a diferencia de la oferta/respuesta de la
      // llamada en sí, que sí reintenta) y nunca le llega al cliente.
      const requestPassportBtn = document.getElementById('requestPassportBtn');
      const requestCardBtn = document.getElementById('requestCardBtn');
      const requestEmailBtn = document.getElementById('requestEmailBtn');
      const shareScreenBtn = document.getElementById('shareScreenBtn');
      const pipBtn = document.getElementById('pipBtn');
      requestPassportBtn.disabled = true;
      requestCardBtn.disabled = true;
      requestEmailBtn.disabled = true;
      shareScreenBtn.disabled = true;
      pipBtn.disabled = true;
      call = startWebRTCCall({
        supabaseClient,
        channelName: 'call:' + callId,
        isCaller: false,
        localVideoEl: document.getElementById('localVideo'),
        remoteVideoEl: document.getElementById('remoteVideo'),
        onState(state) {
          if (state === 'connected') {
            statusBar.textContent = 'En llamada';
            requestPassportBtn.disabled = false;
            requestCardBtn.disabled = false;
            requestEmailBtn.disabled = false;
            // Compartir pantalla no existe en navegadores de celular (ni
            // Chrome ni Safari lo soportan) — sin esto, el botón se veía
            // igual de activo pero tocarlo no hacía nada, sin explicación.
            if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
              shareScreenBtn.disabled = false;
            } else {
              shareScreenBtn.disabled = true;
              shareScreenBtn.title = 'Compartir pantalla solo funciona desde una computadora, no desde el celular.';
              shareScreenBtn.textContent = '🖥️ Compartir pantalla (solo PC)';
            }
            // Ventana flotante — para que el agente pueda salir a buscar
            // la reserva sin que la llamada se corte por quedar la
            // pestaña en segundo plano.
            if (document.pictureInPictureEnabled && !document.getElementById('remoteVideo').disablePictureInPicture) {
              pipBtn.disabled = false;
            } else {
              pipBtn.disabled = true;
              pipBtn.title = 'Este navegador no soporta la ventana flotante.';
            }
          }
          if (state === 'failed') statusBar.textContent = 'No se pudo conectar';
          if (state === 'ended') closeCallScreen();
        },
        onPhoto: showPassportPhoto,
        onEmail: (email, source) => saveClientEmail(callId, clientToken, email, source),
      });
      shareScreenBtn.onclick = async () => {
        if (!call) return;
        try {
          if (call.isSharingScreen()) {
            await call.stopScreenShare(document.getElementById('localVideo'));
            shareScreenBtn.textContent = '🖥️ Compartir pantalla';
          } else {
            await call.startScreenShare(document.getElementById('localVideo'));
            shareScreenBtn.textContent = '🖥️ Volver a la cámara';
          }
        } catch (err) {
          // Si el navegador no soporta getDisplayMedia (típico en
          // celulares — hoy compartir pantalla solo anda desde una
          // computadora) o el usuario canceló el selector, antes esto
          // quedaba en silencio total y parecía que "no hacía nada".
          if (err && err.name !== 'NotAllowedError') {
            alert('No se pudo compartir la pantalla: ' + (err.message || err.name || 'no soportado en este navegador. Probá desde una computadora.'));
          }
        }
      };

      pipBtn.onclick = async () => {
        const video = document.getElementById('remoteVideo');
        try {
          if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
          } else {
            await video.requestPictureInPicture();
          }
        } catch (err) {
          alert('No se pudo abrir la ventana flotante: ' + (err.message || err.name));
        }
      };
      document.getElementById('hangupBtn').onclick = async () => {
        // Respaldo real, guardado en la base — antes, colgar solo mandaba
        // un aviso puntual por el canal de la llamada (WebRTC/Realtime).
        // Si ese aviso se perdía (red mala, celular del cliente en
        // segundo plano), la pantalla del cliente se quedaba trabada para
        // siempre, sin ninguna forma de enterarse de que ya terminó. Con
        // esto, aunque el aviso en vivo falle, el cliente lo puede
        // consultar por su cuenta (ver el sondeo agregado en llamar.html).
        supabaseClient.from('call_requests').update({ status: 'ended', updated_at: new Date().toISOString() }).eq('id', callId).then(() => {});
        if (call) await call.hangup();
        closeCallScreen();
      };
      document.getElementById('muteBtn').onclick = function () {
        if (!call) return;
        this.classList.toggle('active', call.toggleMute());
      };
      document.getElementById('videoBtn').onclick = function () {
        if (!call) return;
        this.classList.toggle('active', call.toggleVideo());
      };
      document.getElementById('requestPassportBtn').onclick = () => {
        if (call) call.requestPhoto('passport');
      };
      document.getElementById('requestCardBtn').onclick = () => {
        if (call) call.requestPhoto('card');
      };
      document.getElementById('requestEmailBtn').onclick = () => {
        if (call) call.requestEmail();
      };
    }

    function closeCallScreen() {
      document.getElementById('callScreen').classList.remove('active');
      hidePassportPhoto();
      document.getElementById('shareScreenBtn').textContent = '🖥️ Compartir pantalla';
      if (document.pictureInPictureElement) document.exitPictureInPicture().catch(() => {});
      call = null;
      pollTimer = setInterval(loadRingingCalls, 3000);
      loadRingingCalls();
    }
  </script>
</body>
</html>
