<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mime Travel — Dueño</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1B3A5C;
    --coral: #FF7A59;
    --arena: #F5E6D3;
    --dark: #1A1A1A;
    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--arena);
    color: var(--dark);
    min-height: 100vh;
  }
  header {
    background:
      linear-gradient(135deg, rgba(27,58,92,0.88), rgba(15,30,48,0.82)),
      url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=60') center/cover no-repeat;
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  header h1 { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin: 0; }
  header a.back {
    color: #fff;
    text-decoration: none;
    font-size: 12.5px;
    font-weight: 600;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.35);
    padding: 7px 14px;
    border-radius: 8px;
    white-space: nowrap;
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 60px; }
  .card {
    background: #fff;
    border: 1px solid rgba(27,58,92,0.06);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 3px 14px rgba(27,58,92,0.08);
  }
  .card h2 { font-family: var(--font-display); font-size: 16px; margin: 0 0 12px; color: var(--primary); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; font-weight: 700; color: rgba(26,26,26,0.6); margin-bottom: 4px; }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1.5px solid rgba(27,58,92,0.15);
    font-size: 14px;
    font-family: inherit;
  }
  .btn {
    border: none;
    background: var(--coral);
    color: #fff;
    border-radius: 20px;
    padding: 10px 20px;
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.5; }
  .msg { font-size: 13px; margin-top: 10px; }
  .msg.error { color: #c0392b; }
  .msg.success { color: #2e7d32; }
  .invite-box {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    background: var(--arena);
    font-size: 13px;
  }
  .invite-box .code { font-family: monospace; font-size: 18px; font-weight: 700; color: var(--primary); }
  .agent-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid rgba(27,58,92,0.06);
    font-size: 13.5px;
  }
  .agent-row:last-child { border-bottom: none; }
  .agent-row .role-tag {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(95,191,179,0.2);
    color: #2c7a6f;
  }
  .agent-row .role-tag.owner { background: rgba(255,122,89,0.2); color: var(--coral); }
  .agent-row .role-tag.conn-yes { background: rgba(46,125,50,0.15); color: #2e7d32; }
  .agent-row .role-tag.conn-no { background: rgba(26,26,26,0.08); color: rgba(26,26,26,0.55); }
  .empty { text-align: center; color: rgba(26,26,26,0.5); font-size: 13.5px; padding: 12px 0; }
  .q-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .q-tab {
    border: 1.5px solid rgba(27,58,92,0.15);
    background: #fff;
    color: var(--primary);
    border-radius: 16px;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .q-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .q-card {
    border: 1px solid rgba(27,58,92,0.08);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    background: var(--arena);
  }
  .q-card .q-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .q-card .q-agent {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(27,58,92,0.1);
    color: var(--primary);
    white-space: nowrap;
  }
  .q-card .q-route { font-weight: 700; font-size: 14px; }
  .q-card .q-meta { font-size: 12.5px; color: rgba(26,26,26,0.65); margin-top: 2px; }
</style>
</head>
<body>
  <header>
    <h1>🗝️ Dueño</h1>
    <div style="display:flex; gap:8px; align-items:center;">
      <a class="back" href="panel.html">👤 Modo agente</a>
      <a class="back" href="panel.html">← Panel</a>
      <button id="logoutBtn" style="background:none; border:1px solid rgba(255,255,255,0.4); color:#fff; border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer;">Salir</button>
    </div>
  </header>
  <main>
    <div class="card">
      <h2>Crear agente</h2>
      <form id="createAgentForm">
        <div class="field">
          <label for="agentFullName">Nombre completo</label>
          <input type="text" id="agentFullName" required>
        </div>
        <div class="field">
          <label for="agentEmail">Correo</label>
          <input type="email" id="agentEmail" required>
        </div>
        <div class="field">
          <label for="agentPassword">Contraseña inicial (6+ caracteres)</label>
          <input type="password" id="agentPassword" minlength="6" required>
        </div>
        <button type="submit" class="btn" id="createAgentBtn">Crear agente</button>
      </form>
      <p class="msg" id="createAgentMsg"></p>
      <div class="invite-box" id="inviteBox" hidden>
        Cuenta creada. Código de invitación: <span class="code" id="inviteCode"></span>
      </div>
    </div>

    <div class="card">
      <h2>Equipo</h2>
      <div id="teamList"></div>
    </div>

    <div class="card">
      <h2>Registro de llamadas</h2>
      <div id="callsLogList"></div>
    </div>

    <div class="card">
      <h2>Cotizaciones del equipo</h2>
      <div class="q-tabs">
        <button type="button" class="q-tab active" data-tab="new">Nuevas</button>
        <button type="button" class="q-tab" data-tab="quoted">Cotizadas</button>
        <button type="button" class="q-tab" data-tab="accepted">Aceptadas</button>
        <button type="button" class="q-tab" data-tab="sold">Vendidas</button>
      </div>
      <div id="teamQuotesList"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://ihrfaprvzdafclquuhlh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lcWymV25nHd2_iOMjRwD4A_XOXvOdPK';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const CREATE_AGENT_URL = SUPABASE_URL + '/functions/v1/create-agent';
    const DELETE_AGENT_URL = SUPABASE_URL + '/functions/v1/delete-agent';
    const UPDATE_AGENT_URL = SUPABASE_URL + '/functions/v1/update-agent-credentials';
    // Mismas constantes que ya usa panel.html — para avisarle por push al
    // agente cuando el dueño lo llama (ver callAgent()).
    const WEB_PUSH_WEBHOOK_SECRET = '3a61e1f14f2ff3350889bd67cf2250bebde907e17b6d733e';
    const WEB_PUSH_FUNCTIONS_URL = SUPABASE_URL + '/functions/v1/send-web-push';

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    });

    // Guardia de sesión + rol: solo el Dueño (super_admin) entra acá —
    // cualquier otro agente que llegue a esta URL a mano se va derecho
    // al panel normal, no ve nada de esto.
    (async () => {
      const { data: userData } = await supabaseClient.auth.getUser();
      if (!userData?.user) {
        window.location.href = 'login.html';
        return;
      }
      const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', userData.user.id).maybeSingle();
      if (profile?.role !== 'super_admin') {
        window.location.href = 'panel.html';
        return;
      }
      // Se espera a que termine loadTeam (llena agentNamesById) antes de
      // pintar las cotizaciones — si no, la primera tanda mostraba
      // "Agente" genérico en vez del nombre real hasta el próximo cambio.
      await loadTeam();
      loadTeamQuotes();
      loadCallsLog();
    })();

    // Mapa id -> nombre de agente, para no repetir el join en cada
    // cotización — se pide una sola vez (el equipo no cambia tan seguido)
    // y se reusa acá y en loadTeamQuotes.
    let agentNamesById = {};
    // "Conectado" = mandó su latido de presencia hace menos de 90s (mismo
    // margen que ya usa el resto del sistema, ver agente/presence.js) —
    // no es lo mismo que el interruptor 🟢/🔴 "Disponible" (ese lo prende/
    // apaga el agente a mano; esto es si tiene el panel abierto AHORA).
    function isConnectedNow(lastActiveAt) {
      if (!lastActiveAt) return false;
      return (Date.now() - new Date(lastActiveAt).getTime()) < 90000;
    }
    async function loadTeam() {
      const { data, error } = await supabaseClient
        .from('profiles')
        .select('id, full_name, role, last_active_at')
        .in('role', ['agent', 'super_admin'])
        .order('full_name', { ascending: true });
      const list = document.getElementById('teamList');
      if (error) {
        list.innerHTML = '<div class="empty">No se pudo cargar el equipo.</div>';
        return;
      }
      if (!data || !data.length) {
        list.innerHTML = '<div class="empty">Todavía no hay agentes.</div>';
        return;
      }
      agentNamesById = {};
      data.forEach((p) => { agentNamesById[p.id] = p.full_name || '(sin nombre)'; });
      list.innerHTML = data.map((p) => {
        const name = escapeHtml(p.full_name || '(sin nombre)');
        const isOwner = p.role === 'super_admin';
        const connected = isConnectedNow(p.last_active_at);
        // Sin botón de llamar para uno mismo (la fila del dueño, viéndola
        // el propio dueño) — no tiene sentido llamarse a sí mismo.
        const callBtn = isOwner ? '' : '<button type="button" class="role-tag" data-call-agent="' + p.id + '" style="border:none; cursor:pointer;">📞</button>';
        // Sin botón de borrar para uno mismo (la fila del dueño) — esta
        // función es solo para dar de baja Agentes que ya no trabajan más.
        const deleteBtn = isOwner ? '' : '<button type="button" class="role-tag" data-delete-agent="' + p.id + '" style="border:none; cursor:pointer;">🗑</button>';
        const editBtn = isOwner ? '' : '<button type="button" class="role-tag" data-edit-agent="' + p.id + '" style="border:none; cursor:pointer;">✏️</button>';
        return '<div class="agent-row"><span>' + name + '</span><span style="display:flex; gap:6px; align-items:center;">' +
          '<span class="role-tag ' + (connected ? 'conn-yes' : 'conn-no') + '">' + (connected ? '🟢 Conectado' : '⚪ Desconectado') + '</span>' +
          '<span class="role-tag' + (isOwner ? ' owner' : '') + '">' + (isOwner ? 'Dueño' : 'Agente') + '</span>' +
          callBtn + editBtn + deleteBtn + '</span></div>';
      }).join('');
      list.querySelectorAll('[data-call-agent]').forEach((btn) => {
        btn.addEventListener('click', () => callAgent(btn.dataset.callAgent));
      });
      list.querySelectorAll('[data-delete-agent]').forEach((btn) => {
        btn.addEventListener('click', () => deleteAgentAccount(btn.dataset.deleteAgent, agentNamesById[btn.dataset.deleteAgent]));
      });
      list.querySelectorAll('[data-edit-agent]').forEach((btn) => {
        btn.addEventListener('click', () => editAgentCredentials(btn.dataset.editAgent, agentNamesById[btn.dataset.editAgent]));
      });
    }

    // Cambia el correo y/o la contraseña de un agente — vía la Edge
    // Function update-agent-credentials, que valida del lado del servidor
    // que quien llama sea el Dueño. Dos prompts simples en vez de un
    // formulario aparte, en línea con el resto de esta pantalla.
    async function editAgentCredentials(agentId, agentName) {
      const newEmail = prompt('Nuevo correo para "' + (agentName || 'este agente') + '" (dejar vacío para no cambiarlo):', '');
      const newPassword = prompt('Nueva contraseña (6+ caracteres, dejar vacío para no cambiarla):', '');
      if (!newEmail && !newPassword) return;
      if (newPassword && newPassword.length < 6) {
        alert('La contraseña necesita al menos 6 caracteres.');
        return;
      }
      try {
        const { data: sessionData } = await supabaseClient.auth.getSession();
        const accessToken = sessionData?.session?.access_token;
        const res = await fetch(UPDATE_AGENT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + accessToken },
          body: JSON.stringify({ agentId, newEmail: newEmail || null, newPassword: newPassword || null }),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || 'No se pudo actualizar el agente.');
        alert('✅ Listo, se actualizó.');
      } catch (err) {
        alert('⚠️ ' + (err && err.message ? err.message : 'Error desconocido.'));
      }
    }

    // Borra la cuenta de un agente por completo (Authentication + su fila
    // en profiles) — vía la Edge Function delete-agent, que valida del
    // lado del servidor que quien llama sea el Dueño.
    async function deleteAgentAccount(agentId, agentName) {
      if (!confirm('¿Borrar del todo la cuenta de "' + (agentName || 'este agente') + '"? No se puede deshacer — pierde acceso al panel para siempre.')) return;
      try {
        const { data: sessionData } = await supabaseClient.auth.getSession();
        const accessToken = sessionData?.session?.access_token;
        const res = await fetch(DELETE_AGENT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + accessToken },
          body: JSON.stringify({ agentId }),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || 'No se pudo borrar el agente.');
        loadTeam();
      } catch (err) {
        alert('⚠️ ' + (err && err.message ? err.message : 'Error desconocido.'));
      }
    }
    // Refresca el estado de conectado/desconectado sin recargar todo el
    // equipo — el latido de cada agente llega cada 45s (ver presence.js),
    // así que 20s de sondeo alcanza para reflejarlo con margen razonable.
    setInterval(loadTeam, 20000);

    // Vista de solo lectura: TODAS las cotizaciones de TODOS los agentes,
    // no solo las del dueño — para actuar sobre una (poner precio, cerrar
    // venta, etc.) hay que ir al modo agente normal, acá no se repiten
    // esos botones.
    let currentTeamTab = 'new';
    function fmtRoute(q) {
      if (q.origin) return escapeHtml(q.origin) + ' → ' + escapeHtml(q.destination || '');
      return escapeHtml(q.destination || '');
    }
    // Llamar a un agente (dueño -> agente) — llamada interna, sumada
    // 2026-09-04. Mismo mecanismo que el botón "Llamar al dueño" de
    // panel.html, pero al revés.
    async function callAgent(agentUserId) {
      const { data: userData } = await supabaseClient.auth.getUser();
      if (!userData?.user) return;
      const callId = crypto.randomUUID();
      const { error } = await supabaseClient.from('internal_call_requests').insert({
        id: callId,
        caller_id: userData.user.id,
        callee_id: agentUserId,
      });
      if (error) {
        alert('No se pudo iniciar la llamada: ' + error.message);
        return;
      }
      // Push al agente — sin esto, si no tiene llamadas.html abierta en ese
      // momento, el timbre nunca suena. Mismo patrón que "Llamar al dueño"
      // en panel.html.
      fetch(WEB_PUSH_FUNCTIONS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Webhook-Secret': WEB_PUSH_WEBHOOK_SECRET },
        body: JSON.stringify({
          agentId: agentUserId,
          title: 'Te está llamando el dueño',
          body: 'Tocá para atender la llamada.',
          url: '/agente/llamadas.html',
        }),
      }).catch(() => {});
      window.location.href = 'llamadas.html?internalOutgoing=' + callId;
    }

    async function loadTeamQuotes() {
      let query = supabaseClient.from('quote_requests').select('*').limit(30);
      if (currentTeamTab === 'new') {
        query = query.eq('status', 'pending').order('created_at', { ascending: true });
      } else if (currentTeamTab === 'accepted') {
        query = query.eq('status', 'decided').eq('client_decision', 'accepted').order('created_at', { ascending: false });
      } else if (currentTeamTab === 'sold') {
        query = query.eq('status', 'purchased').order('created_at', { ascending: false });
      } else {
        query = query.in('status', ['quoted', 'decided']).order('created_at', { ascending: false });
      }
      const { data, error } = await query;
      const list = document.getElementById('teamQuotesList');
      if (error) {
        list.innerHTML = '<div class="empty">No se pudo cargar.</div>';
        return;
      }
      if (!data || !data.length) {
        list.innerHTML = '<div class="empty">No hay cotizaciones acá.</div>';
        return;
      }
      list.innerHTML = data.map((q) => {
        const agentName = q.claimed_by_agent_id
          ? escapeHtml(agentNamesById[q.claimed_by_agent_id] || 'Agente')
          : 'Sin tomar';
        const price = q.quoted_price_basic_usd ?? q.quoted_price_usd;
        const priceLine = price != null ? 'USD ' + price : '';
        const created = q.created_at ? new Date(q.created_at).toLocaleDateString('es', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
        return '<div class="q-card">' +
          '<div class="q-top"><span class="q-route">' + fmtRoute(q) + '</span><span class="q-agent">' + agentName + '</span></div>' +
          '<div class="q-meta">' + escapeHtml(q.contact_name || 'Sin nombre') + (priceLine ? ' · ' + priceLine : '') + (created ? ' · ' + created : '') + '</div>' +
          '</div>';
      }).join('');
    }
    document.querySelectorAll('.q-tab').forEach((tabEl) => {
      tabEl.addEventListener('click', () => {
        document.querySelectorAll('.q-tab').forEach((t) => t.classList.remove('active'));
        tabEl.classList.add('active');
        currentTeamTab = tabEl.dataset.tab;
        loadTeamQuotes();
      });
    });

    // Registro de llamadas — antes no había ningún lugar para ver el
    // historial (solo se veían las que estaban sonando AHORA, en
    // agente/llamadas.html). Últimas 30, más nueva primero.
    const CALL_STATUS_LABEL = {
      accepted: '✅ Contestada',
      declined: '🚫 Rechazada',
      ended: '☎️ Terminada',
      missed: '⏳ Sin contestar',
    };
    async function loadCallsLog() {
      const { data, error } = await supabaseClient
        .from('call_requests')
        .select('id, status, client_language, accepted_by, created_at, updated_at')
        .order('created_at', { ascending: false })
        .limit(30);
      const list = document.getElementById('callsLogList');
      if (error) {
        list.innerHTML = '<div class="empty">No se pudo cargar el registro de llamadas.</div>';
        return;
      }
      if (!data || !data.length) {
        list.innerHTML = '<div class="empty">Todavía no hay llamadas.</div>';
        return;
      }
      list.innerHTML = data.map((c) => {
        const statusLabel = CALL_STATUS_LABEL[c.status] || (c.status || 'Sonando');
        const agentName = c.accepted_by ? escapeHtml(agentNamesById[c.accepted_by] || 'Agente') : 'Nadie atendió';
        const when = c.created_at ? new Date(c.created_at).toLocaleString('es', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
        return '<div class="q-card">' +
          '<div class="q-top"><span class="q-route">' + statusLabel + '</span><span class="q-agent">' + agentName + '</span></div>' +
          '<div class="q-meta">' + escapeHtml((c.client_language || '').toUpperCase()) + (when ? ' · ' + when : '') + '</div>' +
          '</div>';
      }).join('');
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    document.getElementById('createAgentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('createAgentBtn');
      const msg = document.getElementById('createAgentMsg');
      const inviteBox = document.getElementById('inviteBox');
      msg.textContent = '';
      msg.className = 'msg';
      inviteBox.hidden = true;
      btn.disabled = true;
      try {
        const fullName = document.getElementById('agentFullName').value.trim();
        const email = document.getElementById('agentEmail').value.trim();
        const password = document.getElementById('agentPassword').value;
        // La función valida por su cuenta que quien llama sea el Dueño —
        // manda el token de ESTA sesión, no una clave fija, así del lado
        // del servidor sabe exactamente quién la está llamando.
        const { data: sessionData } = await supabaseClient.auth.getSession();
        const accessToken = sessionData?.session?.access_token;
        const res = await fetch(CREATE_AGENT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + accessToken },
          body: JSON.stringify({ fullName, email, password }),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || 'No se pudo crear el agente.');
        msg.textContent = '✅ Agente creado.';
        msg.className = 'msg success';
        document.getElementById('inviteCode').textContent = body.inviteCode;
        inviteBox.hidden = false;
        document.getElementById('createAgentForm').reset();
        loadTeam();
      } catch (err) {
        msg.textContent = '⚠️ ' + (err && err.message ? err.message : 'Error desconocido.');
        msg.className = 'msg error';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
