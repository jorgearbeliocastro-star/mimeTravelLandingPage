<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mime Travel — Resumen de pagos</title>
<style>
  :root {
    --primary: #1B3A5C;
    --coral: #FF7A59;
    --light: #FAFAFA;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--light);
    color: #1A1A1A;
  }
  header {
    background: var(--primary);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header a { color: #fff; text-decoration: none; font-size: 13px; opacity: 0.85; }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px;
  }
  .filter-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 4px;
  }
  .pill {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 20px;
    background: #e8edf2;
    color: var(--primary);
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
    border: 1px solid #e8edf2;
    white-space: nowrap;
  }
  .pill.active { background: var(--primary); color: #fff; }
  .grand-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 10px;
    padding: 12px 16px;
    margin: 8px 0 14px;
  }
  .grand-total .label { font-weight: 700; color: rgba(26,26,26,0.6); font-size: 13px; }
  .grand-total .value { font-weight: 700; color: var(--coral); font-size: 20px; }
  .group-header {
    display: flex;
    justify-content: space-between;
    background: #e8edf2;
    border-radius: 8px;
    padding: 8px 12px;
    margin-top: 14px;
    margin-bottom: 8px;
    font-weight: 700;
    color: var(--primary);
    font-size: 13px;
  }
  .record-card {
    background: #fff;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .record-card .top-row {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
  }
  .record-card .reference { letter-spacing: 1px; }
  .record-card .amount { color: var(--coral); }
  .record-card .source-tag { font-size: 11px; color: var(--primary); font-weight: 700; margin-top: 2px; }
  .record-card .detail-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: rgba(26,26,26,0.6);
    margin-top: 4px;
  }
  .record-card .retention {
    font-size: 11px;
    color: rgba(26,26,26,0.45);
    margin-top: 6px;
  }
  .empty { text-align: center; color: rgba(26,26,26,0.5); font-size: 14px; margin-top: 40px; }
</style>
</head>
<body>
  <header>
    <strong>Resumen de pagos</strong>
    <a href="panel.html">← Panel</a>
  </header>
  <main>
    <div class="filter-row" id="quickFilterRow"></div>
    <div class="filter-row" id="yearFilterRow"></div>
    <div class="filter-row" id="monthFilterRow" style="display:none;"></div>
    <div class="filter-row" id="agentFilterRow" style="display:none;"></div>

    <div class="grand-total">
      <span class="label" id="grandTotalLabel">Total unificado</span>
      <span class="value" id="grandTotalValue">$0.00</span>
    </div>

    <div id="list"></div>
    <div class="empty" id="emptyMsg">No hay pagos registrados todavía.</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://ihrfaprvzdafclquuhlh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lcWymV25nHd2_iOMjRwD4A_XOXvOdPK';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Solo LECTURA a propósito — quote_payment_records/sale_payment_records
    // se llenan solas por el aviso automático de Centrav (gmail-push-webhook),
    // nunca a mano desde acá. Mismo criterio que la app (PaymentRecordsScreen).
    let records = [];
    let quickPeriod = 'all';
    let selectedYear = null;
    let selectedMonth = null; // 0-11
    let selectedAgent = null; // key: agentId o 'name:...'

    const MONTH_LABELS = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

    (async () => {
      const { data: aalData } = await supabaseClient.auth.mfa.getAuthenticatorAssuranceLevel();
      if (!aalData || aalData.currentLevel !== 'aal2') {
        window.location.href = 'login.html';
        return;
      }
      const { data: userData } = await supabaseClient.auth.getUser();
      if (!userData?.user) {
        window.location.href = 'login.html';
        return;
      }
      await loadRecords();
    })();

    async function loadRecords() {
      const [quoteResult, saleResult] = await Promise.all([
        supabaseClient.from('quote_payment_records').select('*'),
        supabaseClient.from('sale_payment_records').select('*'),
      ]);
      const toEntry = (row, source) => ({
        source,
        id: row.id,
        referenceCode: row.reference_code,
        paymentMethod: row.payment_method,
        authorizedByName: row.authorized_by_name,
        amountUSD: Number(row.amount_usd),
        purchasedAtISO: row.purchased_at,
        retentionUntil: row.retention_until,
        agentId: row.agent_id,
        agentFullName: row.agent_full_name,
      });
      records = [
        ...((quoteResult.data || []).map((r) => toEntry(r, 'quote'))),
        ...((saleResult.data || []).map((r) => toEntry(r, 'sale'))),
      ].sort((a, b) => b.purchasedAtISO.localeCompare(a.purchasedAtISO));
      render();
    }

    function isWithinQuickPeriod(iso, period) {
      if (period === 'all') return true;
      const date = new Date(iso);
      const now = new Date();
      if (period === 'today') return date.toDateString() === now.toDateString();
      const dayOfWeek = (now.getDay() + 6) % 7;
      const startOfWeek = new Date(now);
      startOfWeek.setHours(0, 0, 0, 0);
      startOfWeek.setDate(now.getDate() - dayOfWeek);
      return date >= startOfWeek;
    }

    function agentKey(r) {
      return r.agentId || 'name:' + (r.agentFullName || '');
    }

    function ddmmyyyy(iso) {
      const d = new Date(iso);
      return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
    }

    function render() {
      // Filtro por período
      let periodRecords;
      if (selectedYear !== null) {
        periodRecords = records.filter((r) => {
          const d = new Date(r.purchasedAtISO);
          if (d.getFullYear() !== selectedYear) return false;
          if (selectedMonth !== null && d.getMonth() !== selectedMonth) return false;
          return true;
        });
      } else {
        periodRecords = records.filter((r) => isWithinQuickPeriod(r.purchasedAtISO, quickPeriod));
      }

      // Años disponibles (siempre incluye el año actual)
      const years = new Set(records.map((r) => new Date(r.purchasedAtISO).getFullYear()));
      years.add(new Date().getFullYear());
      const availableYears = [...years].sort((a, b) => b - a);

      // Agentes disponibles dentro del período ya filtrado
      const seen = new Map();
      periodRecords.forEach((r) => {
        const key = agentKey(r);
        if (!seen.has(key)) seen.set(key, r.agentFullName || 'Agente desconocido');
      });
      const agentOptions = [...seen.entries()].map(([key, name]) => ({ key, name })).sort((a, b) => a.name.localeCompare(b.name));

      const filteredRecords = selectedAgent ? periodRecords.filter((r) => agentKey(r) === selectedAgent) : periodRecords;
      const grandTotal = filteredRecords.reduce((sum, r) => sum + r.amountUSD, 0);

      // Agrupado por agente, ordenado por total descendente
      const groups = [];
      for (const record of filteredRecords) {
        const key = agentKey(record);
        let group = groups.find((g) => g.key === key);
        if (!group) {
          group = { key, name: record.agentFullName || 'Agente desconocido', records: [], total: 0 };
          groups.push(group);
        }
        group.records.push(record);
        group.total += record.amountUSD;
      }
      groups.sort((a, b) => b.total - a.total);

      // --- Render filtros ---
      const quickFilterRow = document.getElementById('quickFilterRow');
      quickFilterRow.innerHTML = '';
      [{ key: 'all', label: 'Todo' }, { key: 'today', label: 'Hoy' }, { key: 'week', label: 'Esta semana' }].forEach((opt) => {
        const pill = document.createElement('div');
        pill.className = 'pill' + (selectedYear === null && quickPeriod === opt.key ? ' active' : '');
        pill.textContent = opt.label;
        pill.addEventListener('click', () => {
          quickPeriod = opt.key;
          selectedYear = null;
          selectedMonth = null;
          render();
        });
        quickFilterRow.appendChild(pill);
      });

      const yearFilterRow = document.getElementById('yearFilterRow');
      yearFilterRow.innerHTML = '';
      availableYears.forEach((year) => {
        const pill = document.createElement('div');
        pill.className = 'pill' + (selectedYear === year ? ' active' : '');
        pill.textContent = String(year);
        pill.addEventListener('click', () => {
          selectedYear = selectedYear === year ? null : year;
          selectedMonth = null;
          render();
        });
        yearFilterRow.appendChild(pill);
      });

      const monthFilterRow = document.getElementById('monthFilterRow');
      if (selectedYear !== null) {
        monthFilterRow.style.display = 'flex';
        const now = new Date();
        const lastIdx = selectedYear === now.getFullYear() ? now.getMonth() : 11;
        monthFilterRow.innerHTML = '';
        MONTH_LABELS.slice(0, lastIdx + 1).forEach((label, idx) => {
          const pill = document.createElement('div');
          pill.className = 'pill' + (selectedMonth === idx ? ' active' : '');
          pill.textContent = label;
          pill.addEventListener('click', () => {
            selectedMonth = selectedMonth === idx ? null : idx;
            render();
          });
          monthFilterRow.appendChild(pill);
        });
      } else {
        monthFilterRow.style.display = 'none';
      }

      const agentFilterRow = document.getElementById('agentFilterRow');
      if (agentOptions.length > 1) {
        agentFilterRow.style.display = 'flex';
        agentFilterRow.innerHTML = '';
        const allPill = document.createElement('div');
        allPill.className = 'pill' + (selectedAgent === null ? ' active' : '');
        allPill.textContent = 'Todos';
        allPill.addEventListener('click', () => {
          selectedAgent = null;
          render();
        });
        agentFilterRow.appendChild(allPill);
        agentOptions.forEach((opt) => {
          const pill = document.createElement('div');
          pill.className = 'pill' + (selectedAgent === opt.key ? ' active' : '');
          pill.textContent = opt.name;
          pill.addEventListener('click', () => {
            selectedAgent = selectedAgent === opt.key ? null : opt.key;
            render();
          });
          agentFilterRow.appendChild(pill);
        });
      } else {
        agentFilterRow.style.display = 'none';
      }

      // --- Total y lista ---
      document.getElementById('grandTotalLabel').textContent =
        'Total ' + (selectedAgent ? '— ' + (agentOptions.find((o) => o.key === selectedAgent)?.name || '') : 'unificado');
      document.getElementById('grandTotalValue').textContent = '$' + grandTotal.toFixed(2);

      const list = document.getElementById('list');
      const emptyMsg = document.getElementById('emptyMsg');
      list.innerHTML = '';
      if (!filteredRecords.length) {
        emptyMsg.style.display = 'block';
      } else {
        emptyMsg.style.display = 'none';
        groups.forEach((group) => {
          if (!selectedAgent) {
            const gh = document.createElement('div');
            gh.className = 'group-header';
            gh.innerHTML = '<span>' + group.name + '</span><span>$' + group.total.toFixed(2) + '</span>';
            list.appendChild(gh);
          }
          group.records.forEach((r) => {
            const card = document.createElement('div');
            card.className = 'record-card';
            card.innerHTML =
              '<div class="top-row"><span class="reference">' + (r.referenceCode || '') + '</span><span class="amount">$' + r.amountUSD.toFixed(2) + '</span></div>' +
              '<div class="source-tag">' + (r.source === 'quote' ? 'Cotización de cliente' : 'Venta directa') + '</div>' +
              '<div class="detail-row"><span>Forma de pago</span><span>' + (r.paymentMethod === 'wise' ? 'Wise' : 'Tarjeta') + '</span></div>' +
              '<div class="detail-row"><span>Autorizado por</span><span>' + (r.authorizedByName || '') + '</span></div>' +
              '<div class="detail-row"><span>Fecha</span><span>' + ddmmyyyy(r.purchasedAtISO) + '</span></div>' +
              (r.retentionUntil ? '<div class="retention">Se borra automáticamente el ' + ddmmyyyy(r.retentionUntil) + ' (ventana de reclamo vencida)</div>' : '');
            list.appendChild(card);
          });
        });
      }
    }
  </script>
</body>
</html>
