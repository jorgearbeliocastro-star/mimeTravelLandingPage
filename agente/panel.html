<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Mime Travel — Panel de agentes</title>
<style>
  :root {
    --primary: #1B3A5C;
    --coral: #FF7A59;
    --light: #FAFAFA;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--light);
    color: #1A1A1A;
  }
  header {
    background: var(--primary);
    color: #fff;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
  }
  header button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.5);
    color: #fff;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 24px;
    text-align: center;
  }
  main p {
    color: rgba(26,26,26,0.6);
    font-size: 14px;
  }
</style>
</head>
<body>
  <header>
    <h1 id="whoami">Panel de agentes</h1>
    <button id="logoutBtn">Salir</button>
  </header>
  <main>
    <p><a href="llamadas.html">📞 Ver llamadas entrantes</a></p>
    <p>
      <button id="pushBtn">🔔 Activar notificaciones de llamadas</button>
    </p>
    <p id="pushMsg" style="font-size:13px; color:rgba(26,26,26,0.6);"></p>
    <p>Base del panel de agentes en la web — recién arrancando. Acá va a ir lo que se construya después (cotizaciones, chat).</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://ihrfaprvzdafclquuhlh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lcWymV25nHd2_iOMjRwD4A_XOXvOdPK';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Guardia de sesión: sin login + segundo factor verificado (aal2), no
    // se puede ver nada de este panel — vuelve directo al login.
    (async () => {
      const { data: aalData } = await supabaseClient.auth.mfa.getAuthenticatorAssuranceLevel();
      if (!aalData || aalData.currentLevel !== 'aal2') {
        window.location.href = 'login.html';
        return;
      }
      const { data: userData } = await supabaseClient.auth.getUser();
      if (userData?.user) {
        const { data: profile } = await supabaseClient.from('profiles').select('full_name').eq('id', userData.user.id).single();
        document.getElementById('whoami').textContent = 'Hola, ' + (profile?.full_name || userData.user.email);
      }
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    });

    // Llave pública VAPID — es pública a propósito (el navegador la usa
    // para cifrar hacia el servidor de push), la privada solo vive en el
    // secret de la función send-web-push, nunca acá.
    const VAPID_PUBLIC_KEY = 'BGa5n6mV8kYVoF9fYsiEo-2M1jHRWd-pA2OTyLmAWbe1YCNsE3EGZv-ysXU_69iUaxmskaOng0OTfXT5C4M1_80';
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
    }

    const pushBtn = document.getElementById('pushBtn');
    const pushMsg = document.getElementById('pushMsg');

    async function refreshPushButton() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        pushBtn.disabled = true;
        pushMsg.textContent = 'Este navegador no soporta notificaciones push.';
        return;
      }
      const reg = await navigator.serviceWorker.register('sw.js');
      const existing = await reg.pushManager.getSubscription();
      pushBtn.textContent = existing ? '🔔 Notificaciones activadas' : '🔔 Activar notificaciones de llamadas';
    }

    pushBtn.addEventListener('click', async () => {
      pushBtn.disabled = true;
      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          pushMsg.textContent = 'No se activó — hace falta permitir las notificaciones.';
          return;
        }
        const reg = await navigator.serviceWorker.register('sw.js');
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
          sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
          });
        }
        const { data: userData } = await supabaseClient.auth.getUser();
        const { error } = await supabaseClient
          .from('agent_push_subscriptions')
          .insert({ agent_id: userData.user.id, subscription: sub.toJSON() });
        if (error) throw error;
        pushMsg.textContent = 'Notificaciones activadas en este dispositivo.';
        pushBtn.textContent = '🔔 Notificaciones activadas';
      } catch (err) {
        pushMsg.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
      } finally {
        pushBtn.disabled = false;
      }
    });

    refreshPushButton();
  </script>
</body>
</html>
