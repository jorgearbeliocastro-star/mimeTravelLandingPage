<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mime Travel — Chat</title>
<style>
  :root {
    --primary: #1B3A5C;
    --coral: #FF7A59;
    --light: #FAFAFA;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--light);
    color: #1A1A1A;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--primary);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header a { color: #fff; text-decoration: none; font-size: 13px; opacity: 0.85; }

  /* Lista de hilos */
  #listView { flex: 1; overflow-y: auto; padding: 16px; max-width: 480px; margin: 0 auto; width: 100%; }
  .thread-card {
    background: #fff;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .thread-card .status { font-size: 12px; color: rgba(26,26,26,0.5); }
  .thread-card .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 8px; background: #eee; }
  .thread-card .badge.mine { background: #d4edda; color: #1e7e34; }
  .empty { text-align: center; color: rgba(26,26,26,0.5); font-size: 14px; margin-top: 40px; }

  /* Vista de conversación */
  #threadView { display: none; flex: 1; flex-direction: column; }
  #threadView.active { display: flex; }
  .thread-header { padding: 10px 16px; border-bottom: 1px solid rgba(0,0,0,0.08); display: flex; align-items: center; gap: 10px; background: #fff; }
  .thread-header button { border: none; background: none; font-size: 20px; cursor: pointer; }
  .thread-header .close-btn { margin-left: auto; font-size: 12px; color: #c0392b; background: none; border: 1px solid #c0392b; border-radius: 8px; padding: 6px 10px; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; }
  .bubble.client { align-self: flex-start; background: #fff; border: 1px solid rgba(0,0,0,0.08); border-bottom-left-radius: 4px; }
  .bubble.agent { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
  form { display: flex; gap: 8px; padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); border-top: 1px solid rgba(0,0,0,0.08); background: #fff; }
  input { flex: 1; padding: 11px 14px; border-radius: 20px; border: 1.5px solid rgba(0,0,0,0.15); font-size: 15px; font-family: inherit; }
  input:focus { outline: none; border-color: var(--primary); }
  button[type=submit] { border: none; background: var(--coral); color: #fff; border-radius: 20px; padding: 0 20px; font-weight: 700; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
  <header>
    <strong>Chats</strong>
    <a href="panel.html">← Panel</a>
  </header>

  <div id="listView">
    <div id="threadList"></div>
    <div class="empty" id="emptyMsg">No hay chats abiertos.</div>
  </div>

  <div id="threadView">
    <div class="thread-header">
      <button id="backBtn">←</button>
      <strong>Conversación</strong>
      <button class="close-btn" id="closeThreadBtn">Cerrar chat</button>
    </div>
    <div class="messages" id="messages"></div>
    <form id="chatForm">
      <input type="text" id="chatInput" placeholder="Escribí tu respuesta…" autocomplete="off" required>
      <button type="submit">Enviar</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://ihrfaprvzdafclquuhlh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lcWymV25nHd2_iOMjRwD4A_XOXvOdPK';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let agentId = null;
    let listPollTimer = null;
    let threadPollTimer = null;
    let currentThreadId = null;
    let lastRenderedIds = '';

    (async () => {
      const { data: aalData } = await supabaseClient.auth.mfa.getAuthenticatorAssuranceLevel();
      if (!aalData || aalData.currentLevel !== 'aal2') {
        window.location.href = 'login.html';
        return;
      }
      const { data: userData } = await supabaseClient.auth.getUser();
      if (!userData?.user) {
        window.location.href = 'login.html';
        return;
      }
      agentId = userData.user.id;
      loadThreads();
      listPollTimer = setInterval(loadThreads, 4000);
    })();

    async function loadThreads() {
      const { data, error } = await supabaseClient
        .from('chat_threads')
        .select('*')
        .eq('status', 'open')
        .order('updated_at', { ascending: false });
      if (error) return;
      renderThreadList(data || []);
    }

    function renderThreadList(threads) {
      const listEl = document.getElementById('threadList');
      const emptyMsg = document.getElementById('emptyMsg');
      listEl.innerHTML = '';
      if (!threads.length) {
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';
      threads.forEach((th) => {
        const card = document.createElement('div');
        card.className = 'thread-card';
        const mine = th.claimed_by_agent_id === agentId;
        const badgeLabel = th.claimed_by_agent_id ? (mine ? 'Tuyo' : 'Tomado') : 'Sin tomar';
        card.innerHTML =
          '<div><div>Cliente anónimo</div><div class="status">Actualizado: ' + new Date(th.updated_at).toLocaleString() + '</div></div>' +
          '<span class="badge' + (mine ? ' mine' : '') + '">' + badgeLabel + '</span>';
        card.addEventListener('click', () => openThread(th));
        listEl.appendChild(card);
      });
    }

    async function openThread(thread) {
      // Se reclama solo si nadie lo tomó todavía — mismo criterio "gana el
      // primero que llega" que el resto de las cotizaciones/llamadas.
      if (!thread.claimed_by_agent_id) {
        await supabaseClient
          .from('chat_threads')
          .update({ claimed_by_agent_id: agentId, updated_at: new Date().toISOString() })
          .eq('id', thread.id)
          .is('claimed_by_agent_id', null);
      }
      currentThreadId = thread.id;
      lastRenderedIds = '';
      document.getElementById('listView').style.display = 'none';
      document.getElementById('threadView').classList.add('active');
      clearInterval(listPollTimer);
      loadMessages();
      threadPollTimer = setInterval(loadMessages, 3000);
    }

    function closeThreadView() {
      currentThreadId = null;
      clearInterval(threadPollTimer);
      document.getElementById('listView').style.display = 'block';
      document.getElementById('threadView').classList.remove('active');
      loadThreads();
      listPollTimer = setInterval(loadThreads, 4000);
    }
    document.getElementById('backBtn').addEventListener('click', closeThreadView);

    async function loadMessages() {
      if (!currentThreadId) return;
      const { data, error } = await supabaseClient
        .from('chat_messages')
        .select('*')
        .eq('thread_id', currentThreadId)
        .order('created_at', { ascending: true });
      if (error) return;
      const idsKey = (data || []).map((m) => m.id).join(',');
      if (idsKey === lastRenderedIds) return;
      lastRenderedIds = idsKey;
      const messagesEl = document.getElementById('messages');
      messagesEl.innerHTML = '';
      (data || []).forEach((m) => {
        const b = document.createElement('div');
        b.className = 'bubble ' + (m.sender === 'client' ? 'client' : 'agent');
        b.textContent = m.body;
        messagesEl.appendChild(b);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    document.getElementById('chatForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentThreadId) return;
      const input = document.getElementById('chatInput');
      const body = input.value.trim();
      if (!body) return;
      input.value = '';
      const { error } = await supabaseClient
        .from('chat_messages')
        .insert({ thread_id: currentThreadId, sender: 'agent', sender_agent_id: agentId, body });
      if (error) {
        alert('No se pudo enviar: ' + error.message);
        return;
      }
      lastRenderedIds = '';
      loadMessages();
    });

    document.getElementById('closeThreadBtn').addEventListener('click', async () => {
      if (!currentThreadId) return;
      if (!confirm('¿Cerrar este chat? Se borran los mensajes.')) return;
      const { error } = await supabaseClient.rpc('close_chat_thread', { p_thread_id: currentThreadId });
      if (error) {
        alert('Error: ' + error.message);
        return;
      }
      closeThreadView();
    });
  </script>
</body>
</html>
