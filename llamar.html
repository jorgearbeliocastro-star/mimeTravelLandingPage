<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mime Travel — Llamar a un agente</title>
<style>
  :root {
    --primary: #1B3A5C;
    --coral: #FF7A59;
    --dark: #1A1A1A;
    --light: #FAFAFA;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: #0d1b2a;
    color: #fff;
    /* 100vh en el celular cuenta el espacio de la barra de direcciones
       aunque esté escondida — los controles de abajo terminaban tapados
       por la barra de gestos/navegación del sistema. 100dvh (altura
       "dinámica" real del viewport) lo evita; 100vh queda de respaldo
       para navegadores viejos que no la soportan. */
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  .status-bar {
    text-align: center;
    padding: 18px;
    font-size: 15px;
    font-weight: 700;
  }
  .choice-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .choice-btn {
    width: 220px;
    padding: 14px;
    margin-bottom: 12px;
    border-radius: 24px;
    border: none;
    background: var(--coral);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  #choiceAudioBtn {
    background: rgba(255,255,255,0.15);
  }
  .video-area {
    flex: 1;
    min-height: 0;
    position: relative;
    background: #000;
  }
  #remoteVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #111;
  }
  #localVideo {
    position: absolute;
    bottom: 16px;
    right: 16px;
    width: 110px;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.4);
    background: #222;
  }
  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
  }
  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 24px;
    /* Deja espacio extra si el teléfono tiene barra de gestos abajo —
       si no, los botones quedaban pegados o tapados por ella. */
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }
  .btn-circle {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.15);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
  }
  .btn-circle.active { background: var(--coral); }
  .btn-hangup { background: #c0392b; }
  .fallback {
    text-align: center;
    padding: 0 24px 24px;
  }
  .fallback a {
    color: var(--coral);
    font-weight: 700;
    text-decoration: none;
  }
  .fallback { display: none; }
  .fallback.show { display: block; }

  .photo-request-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 0 16px 10px;
    padding: 12px 14px;
    background: var(--coral);
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 700;
  }
  .photo-request-banner.show { display: flex; }
  /* El de correo lleva más contenido (botón de Google + input a mano) que
     no entra bien en una sola fila como el de la foto — se apila en
     columna en vez de reusar el layout de fila del resto. */
  #emailRequestBanner.show { display: flex; flex-direction: column; align-items: stretch; }
  #emailRequestBanner button[type="submit"] {
    border: none;
    background: #fff;
    color: var(--coral);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .photo-request-banner button {
    border: none;
    background: #fff;
    color: var(--coral);
    border-radius: 16px;
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
  }
  .pip-row {
    text-align: center;
    padding: 0 16px 8px;
  }
  .pip-row button {
    border: 1.5px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.1);
    color: #fff;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .pip-row button:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>

  <!-- Elección inicial: con video o solo audio — antes de que nada empiece
       a llamar. Recién al elegir arranca main() (ver abajo). -->
  <div class="choice-screen" id="choiceScreen">
    <div class="avatar" style="margin-bottom: 20px;">📞</div>
    <p style="margin-bottom: 20px; text-align: center; padding: 0 24px;">¿Cómo preferís hacer la llamada?</p>
    <button type="button" class="choice-btn" id="choiceVideoBtn">📹 Con video</button>
    <button type="button" class="choice-btn" id="choiceAudioBtn">🎤 Solo audio</button>
  </div>

  <div class="status-bar" id="statusBar" style="display:none;">Llamando…</div>

  <div class="video-area" id="videoArea" style="display:none;">
    <video id="remoteVideo" autoplay playsinline></video>
    <div class="placeholder" id="placeholder">
      <div class="avatar">📞</div>
    </div>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>

  <div class="fallback" id="fallbackBox">
    <p>No se pudo conectar la llamada.</p>
    <a href="index.html?chat=1">Escribinos por el chat</a>
  </div>

  <!-- Solo aparece cuando el AGENTE pide una foto puntual (ver
       onPhotoRequest) — el cliente no decide solo cuándo mandarla. -->
  <div class="photo-request-banner" id="photoRequestBanner">
    <span id="photoRequestText"></span>
    <button type="button" id="photoRequestBtn">Tomar o subir foto</button>
  </div>

  <!-- Solo aparece cuando el AGENTE pide el correo (para emitir el tiket) —
       igual que con la foto, el cliente decide cómo responder: a mano o
       con un toque desde Google. -->
  <div class="photo-request-banner" id="emailRequestBanner">
    <span>El agente te pidió tu correo (para enviarte el tiket).</span>
    <div id="googleEmailBtn"></div>
    <form id="emailRequestForm" style="display:flex; gap:8px; margin-top:8px;">
      <input type="email" id="emailRequestInput" placeholder="tu@email.com" required
        style="flex:1; padding:10px; border-radius:8px; border:none; font-size:14px;">
      <button type="submit">Enviar</button>
    </form>
  </div>

  <div class="pip-row" id="pipRow" style="display:none;">
    <button type="button" id="pipBtn">🗗 Ventana flotante (para buscar algo sin cortar la llamada)</button>
  </div>

  <div class="controls" id="controls" style="display:none;">
    <button class="btn-circle" id="muteBtn">🎤</button>
    <button class="btn-circle" id="videoBtn">📷</button>
    <button class="btn-circle btn-hangup" id="hangupBtn">⏹</button>
  </div>
  <!-- Sin "capture" a propósito — con eso el navegador empujaba directo a
       la cámara en algunos celulares. Sin ese atributo, deja elegir entre
       sacar la foto en el momento o subir una que ya tenga guardada
       (mucha gente no anda con el pasaporte físico encima, pero sí tiene
       una foto de antes en el teléfono). -->
  <input type="file" id="photoInput" accept="image/*" style="display:none;">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <!-- Google Identity Services — solo para el botón "Continuar con Google"
       de acá abajo (pedido de correo en llamada). No hace falta si
       GOOGLE_CLIENT_ID queda vacío: el botón simplemente no aparece y
       queda el input a mano. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="webrtcCall.js"></script>
  <script>
    const SUPABASE_URL = 'https://ihrfaprvzdafclquuhlh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lcWymV25nHd2_iOMjRwD4A_XOXvOdPK';
    const WEBHOOK_SECRET = '9aa883ff6caef8d5b41e2c749cccaf121860629737147d12';
    const FUNCTIONS_URL = SUPABASE_URL + '/functions/v1/send-request-notification';
    // Función propia de la web (no la de la app) para la notificación push
    // real del navegador — ver supabase/functions/send-web-push acá mismo.
    const WEB_PUSH_WEBHOOK_SECRET = '3a61e1f14f2ff3350889bd67cf2250bebde907e17b6d733e';
    const WEB_PUSH_FUNCTIONS_URL = SUPABASE_URL + '/functions/v1/send-web-push';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Mismo token que usa el resto de la web pública para identificar este
    // navegador como "cliente sin cuenta" (ver getOrCreateWebClientToken en
    // index.html) — reutiliza la misma clave para que sea el mismo cliente.
    function getClientToken() {
      const KEY = 'la-expancion.client-token';
      let token = localStorage.getItem(KEY);
      if (!token) {
        token = crypto.randomUUID();
        localStorage.setItem(KEY, token);
      }
      return token;
    }

    const statusBar = document.getElementById('statusBar');
    const placeholder = document.getElementById('placeholder');
    const controls = document.getElementById('controls');
    const fallbackBox = document.getElementById('fallbackBox');
    let call = null;
    let ended = false;
    let agentName = null;

    function showFallback() {
      controls.style.display = 'none';
      fallbackBox.classList.add('show');
    }

    // Tono de "llamando" — el clásico brr-brr de teléfono (440+480Hz,
    // 2s de tono / 4s de silencio, cadencia estándar de EE.UU./Latam),
    // sintetizado con Web Audio. Suena desde que se marca hasta que
    // contestan o hasta los 15s, cuando pasa a música de espera (ver
    // abajo) porque ya asumimos que está en cola, no solo "sonando".
    let ringbackAudioCtx = null;
    let ringbackGain = null;
    let ringbackTimer = null;
    let ringbackOn = false;
    function playRingbackBurst() {
      const now = ringbackAudioCtx.currentTime;
      const dur = 2;
      [440, 480].forEach((freq) => {
        const osc = ringbackAudioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const gain = ringbackAudioCtx.createGain();
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(0.22, now + 0.04);
        gain.gain.setValueAtTime(0.22, now + dur - 0.06);
        gain.gain.linearRampToValueAtTime(0.0001, now + dur);
        osc.connect(gain);
        gain.connect(ringbackGain);
        osc.start(now);
        osc.stop(now + dur + 0.05);
      });
    }
    function startRingbackTone() {
      if (ringbackOn) return;
      ringbackOn = true;
      if (!ringbackAudioCtx) ringbackAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (ringbackAudioCtx.state === 'suspended') ringbackAudioCtx.resume().catch(() => {});
      ringbackGain = ringbackGain || ringbackAudioCtx.createGain();
      ringbackGain.gain.value = 0.5;
      ringbackGain.connect(ringbackAudioCtx.destination);
      const cycle = () => {
        if (!ringbackOn) return;
        playRingbackBurst();
        ringbackTimer = setTimeout(cycle, 6000); // 2s tono + 4s silencio
      };
      cycle();
    }
    function stopRingbackTone() {
      ringbackOn = false;
      if (ringbackTimer) {
        clearTimeout(ringbackTimer);
        ringbackTimer = null;
      }
    }

    // Música de espera: piano suave en arpegio (Cmaj7 - Am7 - Fmaj7 -
    // Gsus), sintetizada nota por nota con Web Audio — sin archivo de
    // audio externo, mismo criterio que ya usa agente/llamadas.html para
    // su tono de "monedas". Arranca a los 15s (ver queueMsgTimer más
    // abajo), reemplazando el tono de llamando, para cuando ya asumimos
    // que la espera va a ser larga.
    let holdAudioCtx = null;
    let holdMasterGain = null;
    let holdNoteTimer = null;
    let holdStep = 0;
    const HOLD_PROGRESSION = [
      [261.63, 329.63, 392.0, 493.88], // Cmaj7: C4 E4 G4 B4
      [220.0, 261.63, 329.63, 392.0],  // Am7:   A3 C4 E4 G4
      [174.61, 220.0, 261.63, 329.63], // Fmaj7: F3 A3 C4 E4
      [196.0, 261.63, 293.66, 349.23], // Gsus:  G3 C4 D4 F4
    ];
    function playHoldNote(freq, when) {
      const dur = 2.6;
      const filter = holdAudioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 3200;
      filter.connect(holdMasterGain);

      const fundGain = holdAudioCtx.createGain();
      fundGain.gain.setValueAtTime(0.0001, when);
      fundGain.gain.linearRampToValueAtTime(0.34, when + 0.008);
      fundGain.gain.exponentialRampToValueAtTime(0.0001, when + dur);
      const osc1 = holdAudioCtx.createOscillator();
      osc1.type = 'triangle';
      osc1.frequency.value = freq;
      osc1.connect(fundGain);
      fundGain.connect(filter);

      const overtoneGain = holdAudioCtx.createGain();
      overtoneGain.gain.setValueAtTime(0.0001, when);
      overtoneGain.gain.linearRampToValueAtTime(0.09, when + 0.006);
      overtoneGain.gain.exponentialRampToValueAtTime(0.0001, when + dur * 0.55);
      const osc2 = holdAudioCtx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.value = freq * 2;
      osc2.connect(overtoneGain);
      overtoneGain.connect(filter);

      osc1.start(when);
      osc1.stop(when + dur + 0.1);
      osc2.start(when);
      osc2.stop(when + dur + 0.1);
    }
    function scheduleNextHoldNote() {
      const chord = HOLD_PROGRESSION[Math.floor(holdStep / 4) % HOLD_PROGRESSION.length];
      const note = chord[holdStep % 4];
      playHoldNote(note, holdAudioCtx.currentTime + 0.05);
      holdStep++;
      holdNoteTimer = setTimeout(scheduleNextHoldNote, 720);
    }
    function startHoldMusic() {
      if (holdNoteTimer) return; // ya está sonando
      if (!holdAudioCtx) holdAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (holdAudioCtx.state === 'suspended') holdAudioCtx.resume().catch(() => {});
      holdMasterGain = holdMasterGain || holdAudioCtx.createGain();
      holdMasterGain.gain.value = 0.4;
      holdMasterGain.connect(holdAudioCtx.destination);
      holdStep = 0;
      scheduleNextHoldNote();
    }
    function stopHoldMusic() {
      if (holdNoteTimer) {
        clearTimeout(holdNoteTimer);
        holdNoteTimer = null;
      }
    }
    // Corta cualquiera de los dos que esté sonando — se usa en todos los
    // puntos donde la llamada deja de estar "esperando" (conecta, la
    // rechazan, nadie contestó, cuelga, error).
    function stopWaitingAudio() {
      stopRingbackTone();
      stopHoldMusic();
    }

    async function main() {
      const clientToken = getClientToken();
      const id = crypto.randomUUID();
      window.__callId = id;

      // Si este cliente ya tiene un Agente asignado (le cotizó antes) Y ese
      // Agente está conectado ahora mismo, la llamada le suena solo a él —
      // si no está conectado, cae al pool general en vez de sonarle a nadie
      // y no conectar nunca.
      let targetAgentId = null;
      try {
        const { data: preferredAgentId } = await supabaseClient.rpc('get_preferred_agent_for_client', { p_token: clientToken });
        if (preferredAgentId) {
          const { data: isOnline } = await supabaseClient.rpc('is_agent_recently_active', { p_agent_id: preferredAgentId });
          if (isOnline) targetAgentId = preferredAgentId;
        }
      } catch (e) {
        // no bloqueante — si falla el chequeo, se llama al pool general igual
      }

      const { error } = await supabaseClient.from('call_requests').insert({
        id,
        client_token: clientToken,
        target_agent_id: targetAgentId,
        client_language: (navigator.language || 'es').split('-')[0],
        created_by: null,
      });
      if (error) {
        statusBar.textContent = 'No se pudo iniciar la llamada.';
        showFallback();
        return;
      }
      startRingbackTone();
      // Mismo aviso que recibe el agente cuando llega desde la app — así
      // le suena igual, esté en el teléfono o mirando el panel web (con los
      // push de la app pausados, este de acá queda inerte por ahora, pero
      // no hace daño dejarlo — ver PUSH_NOTIFICATIONS_DISABLED).
      fetch(FUNCTIONS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Webhook-Secret': WEBHOOK_SECRET },
        body: JSON.stringify({ type: 'INSERT', table: 'call_requests', record: { id, target_agent_id: targetAgentId } }),
      }).catch(() => {});
      // Notificación push real del navegador, propia de la web — si hay un
      // agente puntual conectado le llega solo a él, si no, a todos los
      // agentes suscriptos desde agente/panel.html (sin agentId = pool
      // general, mismo criterio que siempre).
      fetch(WEB_PUSH_FUNCTIONS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Webhook-Secret': WEB_PUSH_WEBHOOK_SECRET },
        body: JSON.stringify({
          agentId: targetAgentId,
          title: 'Llamada entrante',
          body: 'Un cliente te está llamando — tocá para atender.',
          url: 'llamadas.html',
        }),
      }).catch(() => {});

      // Si nadie contestó todavía a los 15s, lo más probable es que todos
      // los Agentes estén ocupados con otra llamada (ver migración 0085 —
      // ahí no le suena a nadie hasta que uno se desocupe) y no que la
      // estén ignorando. Avisa eso para que no cuelgue pensando que nadie
      // la vio — la llamada sigue en cola, esperando a que alguien se
      // libere (hasta 8 minutos, ver migración 0086).
      const queueMsgTimer = setTimeout(() => {
        if (ended || statusBar.textContent !== 'Llamando…') return;
        statusBar.textContent = 'Todos los agentes están ocupados — tu llamada quedó en espera.';
        stopRingbackTone();
        startHoldMusic();
      }, 15000);

      // Sondea el estado de la llamada (aceptada/rechazada/sin respuesta)
      // hasta que alguien conteste — igual que hace la app.
      const poll = setInterval(async () => {
        if (ended) return clearInterval(poll);
        const { data } = await supabaseClient.rpc('get_call_request_by_token', { p_token: clientToken, p_id: id });
        const row = (data || [])[0];
        if (!row) return;
        if (row.status === 'accepted' && !call) {
          clearInterval(poll);
          stopWaitingAudio();
          statusBar.textContent = 'Conectando…';
          // Se pide aparte (no viene en este mismo RPC) — no es
          // bloqueante, si tarda o falla la llamada igual arranca.
          if (row.accepted_by) {
            supabaseClient.rpc('get_agent_name', { p_agent_id: row.accepted_by }).then(({ data }) => {
              if (data) {
                agentName = data;
                if (statusBar.textContent === 'En llamada') statusBar.textContent = 'En llamada con ' + agentName;
              }
            }).catch(() => {});
          }
          startCall();
        } else if (row.status === 'declined' || row.status === 'missed') {
          clearInterval(poll);
          if (ended) return;
          ended = true;
          stopHoldMusic();
          statusBar.textContent = row.status === 'declined' ? 'Llamada rechazada' : 'Nadie contestó';
          showFallback();
          // Único de los 4 casos que se quedaba sin volver solo a la
          // página principal — "no se pudo conectar" y "colgó el agente
          // ya conectado" sí redirigían, pero "rechazó" o "nadie
          // contestó" (ANTES de conectar) se quedaban clavados para
          // siempre en esta pantalla.
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 4000);
        }
      }, 2000);
    }

    // Se dispara tanto por el aviso en vivo (WebRTC/onState) como por el
    // sondeo de respaldo de más abajo — cualquiera de los dos que llegue
    // primero. `ended` evita que se ejecute dos veces.
    function handleCallEnded() {
      if (ended) return;
      ended = true;
      stopHoldMusic();
      statusBar.textContent = 'Llamada finalizada';
      controls.style.display = 'none';
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1500);
    }

    function startCall() {
      placeholder.style.display = 'none';
      controls.style.display = 'flex';
      // Si eligió "Solo audio", ni siquiera se le pide permiso de cámara —
      // el localVideo/remoteVideo quedan sin imagen, solo audio, y el
      // botón de prender/apagar cámara no tiene sentido (no hay track).
      if (!wantsVideo) {
        document.getElementById('localVideo').style.display = 'none';
        document.getElementById('videoBtn').style.display = 'none';
      }
      // Respaldo: el aviso de "colgar" viaja por el canal en vivo de la
      // llamada (WebRTC/Realtime) — si ese aviso puntual se pierde (red
      // mala, este celular en segundo plano), la pantalla se quedaba
      // trabada para siempre. Este sondeo consulta la base directo, sin
      // depender de que la conexión en vivo siga sana, y agarra el "colgó
      // el agente" (ver el update a call_requests en agente/llamadas.html)
      // aunque el otro aviso nunca llegue.
      const endedPoll = setInterval(async () => {
        if (ended) return clearInterval(endedPoll);
        try {
          const { data } = await supabaseClient.rpc('get_call_request_by_token', { p_token: getClientToken(), p_id: window.__callId });
          const row = (data || [])[0];
          if (row && row.status === 'ended') {
            clearInterval(endedPoll);
            handleCallEnded();
          }
        } catch (e) {
          // no bloqueante — se reintenta en el próximo ciclo
        }
      }, 4000);
      call = startWebRTCCall({
        supabaseClient,
        channelName: 'call:' + window.__callId,
        isCaller: true,
        video: wantsVideo,
        localVideoEl: document.getElementById('localVideo'),
        remoteVideoEl: document.getElementById('remoteVideo'),
        onState(state) {
          if (state === 'connected') {
            statusBar.textContent = agentName ? 'En llamada con ' + agentName : 'En llamada';
            // Ventana flotante — para que el cliente pueda salir a buscar
            // algo (el pasaporte, la tarjeta) en otra app sin que la
            // llamada se corte por quedar la pestaña en segundo plano.
            const pipRow = document.getElementById('pipRow');
            if (document.pictureInPictureEnabled) {
              pipRow.style.display = 'block';
            }
          }
          if (state === 'failed') {
            // Cubre además el caso de que el agente cierre la pestaña de
            // golpe (sin tocar "colgar") — nunca llega el aviso de
            // hangup, pero WebRTC igual termina detectando la conexión
            // caída sola y cae acá.
            if (ended) return;
            ended = true;
            statusBar.textContent = 'No se pudo conectar';
            showFallback();
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 4000);
          }
          if (state === 'ended') handleCallEnded();
        },
        onPhotoRequest: showPhotoRequestBanner,
        onEmailRequest: showEmailRequestBanner,
      });
    }

    document.getElementById('muteBtn').addEventListener('click', function () {
      if (!call) return;
      const isMuted = call.toggleMute();
      this.classList.toggle('active', isMuted);
    });
    document.getElementById('videoBtn').addEventListener('click', function () {
      if (!call) return;
      const isOff = call.toggleVideo();
      this.classList.toggle('active', isOff);
    });
    // El agente pide la foto (ver requestPhoto en agente/llamadas.html) —
    // acá solo se muestra el aviso con lo que pidió; el cliente decide si
    // la toma tocando el botón (el navegador no deja abrir la cámara sola
    // sin que la persona toque algo, así que igual haría falta este paso).
    const PHOTO_REQUEST_LABELS = {
      passport: 'El agente te pidió una foto de tu pasaporte.',
      card: 'El agente te pidió una foto de tu tarjeta.',
    };
    let pendingPhotoKind = null;
    function showPhotoRequestBanner(kind) {
      pendingPhotoKind = kind;
      document.getElementById('photoRequestText').textContent = PHOTO_REQUEST_LABELS[kind] || 'El agente pidió una foto.';
      document.getElementById('photoRequestBanner').classList.add('show');
    }
    document.getElementById('photoRequestBtn').addEventListener('click', () => {
      document.getElementById('photoInput').click();
    });
    document.getElementById('photoInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      e.target.value = ''; // permite volver a elegir la misma foto si hace falta reenviar
      document.getElementById('photoRequestBanner').classList.remove('show');
      if (!file || !call || !pendingPhotoKind) return;
      try {
        await call.sendPhoto(file, pendingPhotoKind);
      } catch (err) {
        alert('No se pudo mandar la foto: ' + (err && err.message ? err.message : String(err)));
      }
      pendingPhotoKind = null;
    });
    // El agente pide el correo (ver requestEmail en agente/llamadas.html,
    // solo cuando hace falta emitir el tiket) — el cliente responde a mano
    // o con Google, nunca se pide antes de que haga falta de verdad.
    function showEmailRequestBanner() {
      document.getElementById('emailRequestBanner').classList.add('show');
    }
    function hideEmailRequestBanner() {
      document.getElementById('emailRequestBanner').classList.remove('show');
    }
    document.getElementById('emailRequestForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('emailRequestInput').value.trim();
      if (!email || !call) return;
      try {
        await call.sendEmail(email, 'manual');
        hideEmailRequestBanner();
      } catch (err) {
        alert('No se pudo mandar el correo: ' + (err && err.message ? err.message : String(err)));
      }
    });

    // Botón "Continuar con Google" — solo se arma si hay un client ID real
    // configurado (hace falta crearlo en Google Cloud Console, autorizando
    // el dominio mimetravel.com; hasta entonces queda solo el input a
    // mano, que funciona igual sin depender de esto). Da el correo con un
    // solo toque, ya verificado por Google — más rápido y confiable que
    // escribirlo a mano en medio de una llamada.
    const GOOGLE_CLIENT_ID = '146724506715-hsvvl5tmqeqs59aoloaj128p38k59g9h.apps.googleusercontent.com';
    function decodeGoogleJwtEmail(credential) {
      const payload = JSON.parse(atob(credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
      return payload.email;
    }
    function initGoogleEmailButton() {
      if (!GOOGLE_CLIENT_ID || !window.google || !window.google.accounts) return;
      window.google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: async (response) => {
          if (!call) return;
          try {
            const email = decodeGoogleJwtEmail(response.credential);
            await call.sendEmail(email, 'google');
            hideEmailRequestBanner();
          } catch (err) {
            alert('No se pudo mandar el correo: ' + (err && err.message ? err.message : String(err)));
          }
        },
      });
      window.google.accounts.id.renderButton(document.getElementById('googleEmailBtn'), { theme: 'filled_blue', size: 'large', text: 'continue_with' });
    }
    window.addEventListener('load', () => setTimeout(initGoogleEmailButton, 500));

    document.getElementById('pipBtn').addEventListener('click', async () => {
      const video = document.getElementById('remoteVideo');
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else {
          await video.requestPictureInPicture();
        }
      } catch (err) {
        alert('No se pudo abrir la ventana flotante en este navegador.');
      }
    });
    document.getElementById('hangupBtn').addEventListener('click', async function () {
      ended = true;
      stopHoldMusic();
      if (call) await call.hangup();
      const clientToken = getClientToken();
      try {
        await supabaseClient.rpc('client_end_call', { p_token: clientToken, p_id: window.__callId });
      } catch (e) {}
      window.location.href = 'index.html';
    });

    let wantsVideo = true;
    function startAfterChoice(withVideo) {
      wantsVideo = withVideo;
      document.getElementById('choiceScreen').style.display = 'none';
      statusBar.style.display = 'block';
      document.getElementById('videoArea').style.display = 'block';
      // El botón de colgar tiene que estar disponible YA, mientras suena
      // ("Llamando…") — antes solo aparecía recién cuando el agente
      // atendía (adentro de startCall), así que si nadie contestaba
      // todavía, el cliente no tenía forma de cancelar la llamada. El
      // propio handler de hangupBtn ya soporta que `call` sea null.
      controls.style.display = 'flex';
      main();
    }
    document.getElementById('choiceVideoBtn').addEventListener('click', () => startAfterChoice(true));
    document.getElementById('choiceAudioBtn').addEventListener('click', () => startAfterChoice(false));
  </script>
</body>
</html>
