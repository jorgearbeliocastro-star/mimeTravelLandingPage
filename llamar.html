<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mime Travel — Llamar a un agente</title>
<style>
  :root {
    --primary: #1B3A5C;
    --coral: #FF7A59;
    --dark: #1A1A1A;
    --light: #FAFAFA;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: #0d1b2a;
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  .status-bar {
    text-align: center;
    padding: 18px;
    font-size: 15px;
    font-weight: 700;
  }
  .choice-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .choice-btn {
    width: 220px;
    padding: 14px;
    margin-bottom: 12px;
    border-radius: 24px;
    border: none;
    background: var(--coral);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  #choiceAudioBtn { background: rgba(255,255,255,0.15); }
  .video-area {
    flex: 1;
    min-height: 0;
    position: relative;
    background: #000;
  }
  #remoteVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #111;
  }
  #localVideo {
    position: absolute;
    bottom: 16px;
    right: 16px;
    width: 110px;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.4);
    background: #222;
  }
  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
  }
  .doc-request-banner {
    display: none;
    position: absolute;
    top: 16px;
    left: 16px;
    right: 16px;
    background: rgba(255,122,89,0.95);
    color: #fff;
    padding: 12px 16px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    text-align: center;
    z-index: 6;
  }
  .doc-request-banner.active { display: block; }

  /* Mientras se pide un documento, el cliente pasa a ver SU PROPIA
     cámara en grande (para poder encuadrar), con un recuadro guía tipo
     tarjeta de crédito — igual que el escaneo de tarjeta de las apps de
     pago: acercás la cámara hasta que el documento entra en el
     recuadro. */
  .video-area.doc-capture #localVideo {
    position: static;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 0;
    border: none;
  }
  .video-area.doc-capture #remoteVideo {
    position: absolute;
    bottom: 16px;
    right: 16px;
    width: 110px;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.4);
    z-index: 2;
  }
  .doc-guide-frame {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 78%;
    aspect-ratio: 1.586 / 1;
    border: 3px solid #fff;
    border-radius: 14px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.45);
    z-index: 4;
  }
  .doc-guide-frame.active { display: block; }
  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 24px;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }
  .btn-circle {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.15);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
  }
  .btn-circle.active { background: var(--coral); }
  .btn-hangup { background: #c0392b; }
  .fallback {
    text-align: center;
    padding: 0 24px 24px;
  }
  .fallback a {
    color: var(--coral);
    font-weight: 700;
    text-decoration: none;
  }
  .fallback { display: none; }
  .fallback.show { display: block; }
</style>
</head>
<body>
  <div class="choice-screen" id="choiceScreen">
    <div class="avatar" style="margin-bottom: 20px;">📞</div>
    <p style="margin-bottom: 20px; text-align: center; padding: 0 24px;">¿Cómo preferís hacer la llamada?</p>
    <button type="button" class="choice-btn" id="choiceVideoBtn">📹 Con video</button>
    <button type="button" class="choice-btn" id="choiceAudioBtn">🎤 Solo audio</button>
  </div>

  <div class="status-bar" id="statusBar" style="display:none;">Llamando…</div>

  <div class="video-area" id="videoArea" style="display:none;">
    <video id="remoteVideo" autoplay playsinline></video>
    <div class="placeholder" id="placeholder">
      <div class="avatar">📞</div>
    </div>
    <video id="localVideo" autoplay playsinline muted></video>
    <div class="doc-guide-frame" id="docGuideFrame"></div>
    <div class="doc-request-banner" id="docRequestBanner"></div>
  </div>

  <div class="fallback" id="fallbackBox">
    <p>No se pudo conectar la llamada.</p>
    <a href="index.html?chat=1">Escribinos por el chat</a>
  </div>

  <div class="controls" id="controls" style="display:none;">
    <button class="btn-circle" id="muteBtn">🎤</button>
    <button class="btn-circle" id="videoBtn">📷</button>
    <button class="btn-circle" id="flipCameraBtn" title="Cambiar de cámara">🔄</button>
    <button class="btn-circle btn-hangup" id="hangupBtn">⏹</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="webrtcCall.js"></script>
  <script>
    const SUPABASE_URL = 'https://ihrfaprvzdafclquuhlh.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lcWymV25nHd2_iOMjRwD4A_XOXvOdPK';
    const WEB_PUSH_WEBHOOK_SECRET = '3a61e1f14f2ff3350889bd67cf2250bebde907e17b6d733e';
    const WEB_PUSH_FUNCTIONS_URL = SUPABASE_URL + '/functions/v1/send-web-push';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Mismo token que usa el resto de la web pública para identificar este
    // navegador como "cliente sin cuenta" (ver getOrCreateWebClientToken en
    // index.html).
    function getClientToken() {
      const KEY = 'la-expancion.client-token';
      let token = localStorage.getItem(KEY);
      if (!token) {
        token = crypto.randomUUID();
        localStorage.setItem(KEY, token);
      }
      return token;
    }

    const statusBar = document.getElementById('statusBar');
    const placeholder = document.getElementById('placeholder');
    const controls = document.getElementById('controls');
    const fallbackBox = document.getElementById('fallbackBox');
    let call = null;
    let ended = false;
    let connectedOnce = false;

    function showFallback() {
      controls.style.display = 'none';
      fallbackBox.classList.add('show');
    }

    // Último recurso: si el celular mata la pestaña de golpe ANTES de que
    // atiendan (segundo plano, se cierra el navegador) mientras todavía
    // está sonando, la fila queda 'ringing' colgada — `pagehide` es el
    // evento que más confiablemente todavía dispara en ese momento; con
    // `keepalive` el pedido sigue viajando aunque la página ya se haya
    // ido.
    //
    // OJO: nunca colgar así una vez que la llamada YA CONECTÓ
    // (connectedOnce) — la pantalla del celular se bloquea sola a los
    // ~30s de no tocarla (confirmado con la base: dos llamadas de prueba
    // duraron 29-31s exactos) y ESO también dispara `pagehide`, cortando
    // una llamada que el cliente seguía escuchando con la pantalla
    // apagada. Antes esto colgaba la llamada activa por error.
    window.addEventListener('pagehide', () => {
      if (ended || !window.__callId || connectedOnce) return;
      try {
        fetch(SUPABASE_URL + '/rest/v1/rpc/client_end_call', {
          method: 'POST',
          keepalive: true,
          headers: {
            'Content-Type': 'application/json',
            apikey: SUPABASE_ANON_KEY,
            Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
          },
          body: JSON.stringify({ p_token: getClientToken(), p_id: window.__callId }),
        });
      } catch (e) {
        // no bloqueante — la página se está yendo de todos modos
      }
    });

    // Tono de "llamando" — el clásico brr-brr de teléfono (440+480Hz, 2s
    // de tono / 4s de silencio), sintetizado con Web Audio. Es el que
    // escucha el CLIENTE — el sonido del pájaro es del agente
    // (agente/llamadas.html), no se comparte acá.
    let ringbackAudioCtx = null;
    let ringbackGain = null;
    let ringbackTimer = null;
    let ringbackOn = false;
    function playRingbackBurst() {
      const now = ringbackAudioCtx.currentTime;
      const dur = 2;
      [440, 480].forEach((freq) => {
        const osc = ringbackAudioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const gain = ringbackAudioCtx.createGain();
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(0.22, now + 0.04);
        gain.gain.setValueAtTime(0.22, now + dur - 0.06);
        gain.gain.linearRampToValueAtTime(0.0001, now + dur);
        osc.connect(gain);
        gain.connect(ringbackGain);
        osc.start(now);
        osc.stop(now + dur + 0.05);
      });
    }
    function startRingbackTone() {
      if (ringbackOn) return;
      ringbackOn = true;
      if (!ringbackAudioCtx) ringbackAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (ringbackAudioCtx.state === 'suspended') ringbackAudioCtx.resume().catch(() => {});
      ringbackGain = ringbackGain || ringbackAudioCtx.createGain();
      ringbackGain.gain.value = 0.5;
      ringbackGain.connect(ringbackAudioCtx.destination);
      const cycle = () => {
        if (!ringbackOn) return;
        playRingbackBurst();
        ringbackTimer = setTimeout(cycle, 6000);
      };
      cycle();
    }
    function stopRingbackTone() {
      ringbackOn = false;
      if (ringbackTimer) {
        clearTimeout(ringbackTimer);
        ringbackTimer = null;
      }
      // Cerrar el AudioContext de verdad, no solo dejar de programar
      // tonos — si queda abierto (aunque esté inactivo), el navegador lo
      // sigue tratando como "hay audio acá" y Android le muestra un
      // control de reproducción de fondo que no tiene nada que ver con
      // la llamada real — y que el sistema puede pausar solo,
      // interfiriendo con la conexión ya conectada.
      if (ringbackAudioCtx) {
        ringbackAudioCtx.close().catch(() => {});
        ringbackAudioCtx = null;
        ringbackGain = null;
      }
    }

    // Música de espera: piano suave en arpegio (Cmaj7 - Am7 - Fmaj7 -
    // Gsus), sintetizada nota por nota — sin archivo de audio externo.
    // Arranca a los 30s (ver queueMsgTimer más abajo) reemplazando el
    // tono de llamando, para cuando ya asumimos que la espera va a ser
    // larga porque todos los agentes están ocupados.
    let holdAudioCtx = null;
    let holdMasterGain = null;
    let holdNoteTimer = null;
    let holdStep = 0;
    const HOLD_PROGRESSION = [
      [261.63, 329.63, 392.0, 493.88], // Cmaj7: C4 E4 G4 B4
      [220.0, 261.63, 329.63, 392.0],  // Am7:   A3 C4 E4 G4
      [174.61, 220.0, 261.63, 329.63], // Fmaj7: F3 A3 C4 E4
      [196.0, 261.63, 293.66, 349.23], // Gsus:  G3 C4 D4 F4
    ];
    function playHoldNote(freq, when) {
      const dur = 2.6;
      const filter = holdAudioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 3200;
      filter.connect(holdMasterGain);
      const fundGain = holdAudioCtx.createGain();
      fundGain.gain.setValueAtTime(0.0001, when);
      fundGain.gain.linearRampToValueAtTime(0.34, when + 0.008);
      fundGain.gain.exponentialRampToValueAtTime(0.0001, when + dur);
      const osc1 = holdAudioCtx.createOscillator();
      osc1.type = 'triangle';
      osc1.frequency.value = freq;
      osc1.connect(fundGain);
      fundGain.connect(filter);
      const overtoneGain = holdAudioCtx.createGain();
      overtoneGain.gain.setValueAtTime(0.0001, when);
      overtoneGain.gain.linearRampToValueAtTime(0.09, when + 0.006);
      overtoneGain.gain.exponentialRampToValueAtTime(0.0001, when + dur * 0.55);
      const osc2 = holdAudioCtx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.value = freq * 2;
      osc2.connect(overtoneGain);
      overtoneGain.connect(filter);
      osc1.start(when);
      osc1.stop(when + dur + 0.1);
      osc2.start(when);
      osc2.stop(when + dur + 0.1);
    }
    function scheduleNextHoldNote() {
      const chord = HOLD_PROGRESSION[Math.floor(holdStep / 4) % HOLD_PROGRESSION.length];
      const note = chord[holdStep % 4];
      playHoldNote(note, holdAudioCtx.currentTime + 0.05);
      holdStep++;
      holdNoteTimer = setTimeout(scheduleNextHoldNote, 720);
    }
    function startHoldMusic() {
      if (holdNoteTimer) return;
      if (!holdAudioCtx) holdAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (holdAudioCtx.state === 'suspended') holdAudioCtx.resume().catch(() => {});
      holdMasterGain = holdMasterGain || holdAudioCtx.createGain();
      holdMasterGain.gain.value = 0.4;
      holdMasterGain.connect(holdAudioCtx.destination);
      holdStep = 0;
      scheduleNextHoldNote();
    }
    function stopHoldMusic() {
      if (holdNoteTimer) {
        clearTimeout(holdNoteTimer);
        holdNoteTimer = null;
      }
      // Mismo motivo que en stopRingbackTone: cerrarlo de verdad, no
      // dejarlo abierto e inactivo de fondo.
      if (holdAudioCtx) {
        holdAudioCtx.close().catch(() => {});
        holdAudioCtx = null;
        holdMasterGain = null;
      }
    }
    function stopWaitingAudio() {
      stopRingbackTone();
      stopHoldMusic();
    }

    // Escaneo de documento (pasaporte/tarjeta), igual que el escaneo de
    // tarjeta de cualquier app de pago: mientras la cámara trasera está
    // encendida, se mide en vivo la zona de la imagen que cae DENTRO del
    // recuadro guía — no el cuadro entero — y recién cuando esa zona se
    // queda quieta Y tiene contenido (no es pared/mesa vacía) se dispara
    // sola la captura. Nada de esto se guarda: la foto capturada se
    // manda directo al agente por el canal de datos de la llamada
    // (peer-to-peer, no pasa por Supabase) y acá no queda ni el recorte
    // ni nada más.
    let docScanRunning = false;
    let docScanRAF = null;
    let docScanTimeout = null;

    function stopDocScan() {
      docScanRunning = false;
      if (docScanRAF) cancelAnimationFrame(docScanRAF);
      docScanRAF = null;
      if (docScanTimeout) clearTimeout(docScanTimeout);
      docScanTimeout = null;
    }

    // Traduce dónde está el recuadro guía EN PANTALLA (CSS) a qué
    // rectángulo de la imagen real de la cámara le corresponde — hace
    // falta porque el video se muestra con object-fit:cover, que recorta
    // y escala distinto según la proporción del teléfono.
    function mapGuideFrameToVideoRect(video, container) {
      const vw = video.videoWidth, vh = video.videoHeight;
      const cw = container.clientWidth, ch = container.clientHeight;
      if (!vw || !vh || !cw || !ch) return null;
      const scale = Math.max(cw / vw, ch / vh);
      const renderedW = vw * scale, renderedH = vh * scale;
      const offsetX = (renderedW - cw) / 2;
      const offsetY = (renderedH - ch) / 2;
      const gw = cw * 0.78;
      const gh = gw / 1.586; // proporción de una tarjeta/pasaporte estándar
      const gx = (cw - gw) / 2;
      const gy = (ch - gh) / 2;
      return {
        x: (gx + offsetX) / scale,
        y: (gy + offsetY) / scale,
        w: gw / scale,
        h: gh / scale,
      };
    }

    function captureAndSendDoc(docType, rect) {
      const video = document.getElementById('localVideo');
      // Un margen alrededor del recuadro, para no cortar el borde del
      // documento si quedó justo al límite.
      const pad = 0.08;
      const x = Math.max(0, rect.x - rect.w * pad);
      const y = Math.max(0, rect.y - rect.h * pad);
      const w = Math.min(video.videoWidth - x, rect.w * (1 + pad * 2));
      const h = Math.min(video.videoHeight - y, rect.h * (1 + pad * 2));
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      c.getContext('2d').drawImage(video, x, y, w, h, 0, 0, w, h);
      const dataUrl = c.toDataURL('image/jpeg', 0.88);
      if (call) call.sendDocPhoto(docType, dataUrl);
      document.getElementById('videoArea').classList.remove('doc-capture');
      document.getElementById('docGuideFrame').classList.remove('active');
      document.getElementById('docRequestBanner').classList.remove('active');
      if (call) call.switchCamera('user');
    }

    function startDocScan(docType) {
      const video = document.getElementById('localVideo');
      const container = document.getElementById('videoArea');
      docScanRunning = true;
      const SW = 80, SH = Math.round(SW / 1.586);
      const sampleCanvas = document.createElement('canvas');
      sampleCanvas.width = SW;
      sampleCanvas.height = SH;
      const sctx = sampleCanvas.getContext('2d', { willReadFrequently: true });
      let prevData = null;
      let stableSince = null;
      const STILL_THRESHOLD = 6; // diferencia promedio por canal tolerada
      const MIN_CONTRAST = 18; // hace falta detalle adentro del recuadro (texto/foto), no pared o mesa lisa
      const MIN_BRIGHTNESS = 25;
      const HOLD_MS = 700;

      function tick() {
        if (!docScanRunning) return;
        const rect = mapGuideFrameToVideoRect(video, container);
        if (!rect) {
          docScanRAF = requestAnimationFrame(tick);
          return;
        }
        sctx.drawImage(video, rect.x, rect.y, rect.w, rect.h, 0, 0, SW, SH);
        const frame = sctx.getImageData(0, 0, SW, SH).data;
        const n = frame.length / 4;
        let brightSum = 0;
        for (let i = 0; i < frame.length; i += 4) brightSum += frame[i];
        const avgBright = brightSum / n;
        let varSum = 0;
        for (let i = 0; i < frame.length; i += 4) varSum += (frame[i] - avgBright) * (frame[i] - avgBright);
        const contrast = Math.sqrt(varSum / n);
        let stillEnough = false;
        if (prevData) {
          let diffSum = 0;
          for (let i = 0; i < frame.length; i += 4) diffSum += Math.abs(frame[i] - prevData[i]);
          stillEnough = diffSum / n < STILL_THRESHOLD;
        }
        if (stillEnough && contrast > MIN_CONTRAST && avgBright > MIN_BRIGHTNESS) {
          if (stableSince === null) stableSince = performance.now();
          if (performance.now() - stableSince >= HOLD_MS) {
            stopDocScan();
            captureAndSendDoc(docType, rect);
            return;
          }
        } else {
          stableSince = null;
        }
        prevData = frame;
        docScanRAF = requestAnimationFrame(tick);
      }
      docScanRAF = requestAnimationFrame(tick);
      // Si en 15s nunca logra un encuadre quieto y con contenido,
      // captura igual lo que haya en el recuadro — mejor eso que dejar
      // al cliente sin salida.
      docScanTimeout = setTimeout(() => {
        if (docScanRunning) {
          const rect = mapGuideFrameToVideoRect(video, container);
          stopDocScan();
          if (rect) captureAndSendDoc(docType, rect);
        }
      }, 15000);
    }

    async function main() {
      const clientToken = getClientToken();
      const id = crypto.randomUUID();
      window.__callId = id;

      const { error } = await supabaseClient.from('call_requests').insert({
        id,
        client_token: clientToken,
        client_language: (navigator.language || 'es').split('-')[0],
      });
      if (error) {
        statusBar.textContent = 'No se pudo iniciar la llamada.';
        showFallback();
        return;
      }
      startRingbackTone();
      // Si nadie contestó a los 30s (parecido a cuánto suena una llamada
      // normal antes de asumir que nadie va a atender), probablemente
      // todos los Agentes están ocupados — pasa a música de espera en
      // vez de seguir sonando como si nada.
      const queueMsgTimer = setTimeout(() => {
        if (ended || statusBar.textContent !== 'Llamando…') return;
        statusBar.textContent = 'Todos los agentes están ocupados — tu llamada quedó en espera.';
        stopWaitingAudio();
        startHoldMusic();
      }, 30000);
      // Notificación push real del navegador — le llega a todos los
      // agentes suscriptos desde agente/panel.html.
      fetch(WEB_PUSH_FUNCTIONS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Webhook-Secret': WEB_PUSH_WEBHOOK_SECRET },
        body: JSON.stringify({
          title: 'Llamada entrante',
          body: 'Un cliente te está llamando — tocá para atender.',
          url: '/agente/llamadas.html',
        }),
      }).catch(() => {});

      // Sondea el estado de la llamada (aceptada/rechazada/sin respuesta)
      // hasta que alguien conteste.
      const poll = setInterval(async () => {
        if (ended) return clearInterval(poll);
        const { data } = await supabaseClient.rpc('get_call_request_by_token', { p_token: clientToken, p_id: id });
        const row = (data || [])[0];
        if (!row) return;
        if (row.status === 'accepted' && !call) {
          clearInterval(poll);
          stopWaitingAudio();
          statusBar.textContent = 'Conectando…';
          startCall();
        } else if (row.status === 'declined' || row.status === 'missed') {
          clearInterval(poll);
          if (ended) return;
          ended = true;
          stopWaitingAudio();
          statusBar.textContent = row.status === 'declined' ? 'Llamada rechazada' : 'Nadie contestó';
          showFallback();
          setTimeout(() => { window.location.href = 'index.html'; }, 4000);
        }
      }, 2000);
    }

    // Se dispara tanto por el aviso en vivo (WebRTC/onState) como por el
    // sondeo de respaldo de más abajo — `ended` evita que se ejecute dos
    // veces.
    function handleCallEnded() {
      if (ended) return;
      ended = true;
      stopWaitingAudio();
      stopDocScan();
      statusBar.textContent = 'Llamada finalizada';
      controls.style.display = 'none';
      setTimeout(() => { window.location.href = 'index.html'; }, 1500);
    }

    function startCall() {
      placeholder.style.display = 'none';
      controls.style.display = 'flex';
      if (!wantsVideo) {
        document.getElementById('localVideo').style.display = 'none';
        document.getElementById('videoBtn').style.display = 'none';
        document.getElementById('flipCameraBtn').style.display = 'none';
      }
      // Respaldo: el aviso de "colgar" viaja por el canal en vivo — si se
      // pierde (red mala, celular en segundo plano), este sondeo agarra
      // el "colgó el agente" directo de la base igual.
      const endedPoll = setInterval(async () => {
        if (ended) return clearInterval(endedPoll);
        try {
          const { data } = await supabaseClient.rpc('get_call_request_by_token', { p_token: getClientToken(), p_id: window.__callId });
          const row = (data || [])[0];
          if (row && row.status === 'ended') {
            clearInterval(endedPoll);
            handleCallEnded();
          }
        } catch (e) {
          // no bloqueante — se reintenta en el próximo ciclo
        }
      }, 4000);

      call = startWebRTCCall({
        supabaseClient,
        channelName: 'call:' + window.__callId,
        isCaller: true,
        video: wantsVideo,
        localVideoEl: document.getElementById('localVideo'),
        remoteVideoEl: document.getElementById('remoteVideo'),
        onDocRequest(docType) {
          const banner = document.getElementById('docRequestBanner');
          banner.textContent = docType === 'card'
            ? '💳 Acercá la tarjeta hasta que quede dentro del recuadro'
            : '🛂 Acercá el pasaporte hasta que quede dentro del recuadro';
          banner.classList.add('active');
          // Un documento se lee mejor con la cámara trasera (mejor
          // foco/calidad que la frontal) — se cambia sola, sin cortar la
          // llamada. Recién cuando ya está en trasera arranca el
          // escaneo, porque necesita el video de ESA cámara para medir.
          document.getElementById('videoArea').classList.add('doc-capture');
          document.getElementById('docGuideFrame').classList.add('active');
          stopDocScan();
          if (call) call.switchCamera('environment').then(() => startDocScan(docType));
        },
        onState(state) {
          if (state === 'connected') {
            connectedOnce = true;
            statusBar.textContent = 'En llamada';
            // Le avisa al navegador/Android que esto es una llamada en
            // vivo, no un video — sin esto, el control automático de
            // "medio reproduciéndose" trae play/pausa como si fuera
            // YouTube, y un toque sin querer (o el sistema) podía
            // pausarla.
            if ('mediaSession' in navigator) {
              navigator.mediaSession.metadata = new MediaMetadata({ title: 'Llamada en curso', artist: 'Mime Travel' });
              navigator.mediaSession.playbackState = 'playing';
              navigator.mediaSession.setActionHandler('pause', () => {});
              navigator.mediaSession.setActionHandler('play', () => {});
              navigator.mediaSession.setActionHandler('stop', () => {});
            }
          }
          if (state === 'failed') {
            if (ended) return;
            ended = true;
            stopWaitingAudio();
            supabaseClient.rpc('client_end_call', { p_token: getClientToken(), p_id: window.__callId }).catch(() => {});
            statusBar.textContent = 'No se pudo conectar';
            showFallback();
            setTimeout(() => { window.location.href = 'index.html'; }, 4000);
          }
          if (state === 'ended') handleCallEnded();
        },
      });
    }

    document.getElementById('muteBtn').addEventListener('click', function () {
      if (!call) return;
      const isMuted = call.toggleMute();
      this.classList.toggle('active', isMuted);
    });
    document.getElementById('videoBtn').addEventListener('click', function () {
      if (!call) return;
      const isOff = call.toggleVideo();
      this.classList.toggle('active', isOff);
    });
    document.getElementById('flipCameraBtn').addEventListener('click', function () {
      if (call) call.toggleCamera();
    });
    document.getElementById('hangupBtn').addEventListener('click', async function () {
      ended = true;
      stopWaitingAudio();
      stopDocScan();
      if (call) await call.hangup();
      try {
        await supabaseClient.rpc('client_end_call', { p_token: getClientToken(), p_id: window.__callId });
      } catch (e) {}
      window.location.href = 'index.html';
    });

    let wantsVideo = true;
    function startAfterChoice(withVideo) {
      wantsVideo = withVideo;
      document.getElementById('choiceScreen').style.display = 'none';
      statusBar.style.display = 'block';
      document.getElementById('videoArea').style.display = 'block';
      controls.style.display = 'flex';
      main();
    }
    document.getElementById('choiceVideoBtn').addEventListener('click', () => startAfterChoice(true));
    document.getElementById('choiceAudioBtn').addEventListener('click', () => startAfterChoice(false));
  </script>
</body>
</html>
